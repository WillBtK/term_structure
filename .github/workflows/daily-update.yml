name: Daily term-premium update

# Robust daily pipeline: refresh all source data (open egress on GitHub runners —
# no proxy flakiness), recompute term premia via the cached-params filter-forward,
# and — when Supabase secrets are configured — upsert the dataset AND publish the
# self-contained Atlas (viz/artifact.html) to a PUBLIC Supabase Storage bucket.
# The bucket serves a stable, auto-updating public URL while this GitHub repo stays
# PRIVATE (GitHub Pages would require a public repo on the free tier).
#
# NOTE: scheduled workflows only run from the repository's DEFAULT branch, so this
# stays dormant until the work merges to the default branch. Use "Run workflow"
# (workflow_dispatch) to trigger it manually on any branch meanwhile.
#
# One-time setup by the repo owner:
#   * Settings → Actions → allow workflows (read/write via the built-in GITHUB_TOKEN).
#   * Settings → Secrets → Actions: SUPABASE_URL, SUPABASE_KEY.
#   * In Supabase: create a PUBLIC Storage bucket (default name "atlas"; override
#     with the SUPABASE_ATLAS_BUCKET secret) — the daily job uploads index.html to it.

# Two runs a day, each placed just AFTER a publication the other one misses. Measured
# publication times (UTC, summer):
#   Treasury CMT (US)  ~19:30-20:00 same day      MoF JGB (JP)    00:30 next business day
#   Bundesbank (DE)    ~14:00 same day            BoE GLC (UK)    by ~11:00 next working day
# The old single 00:00 run sat 30 minutes BEFORE the MoF post, so Japan was a full day
# stale every single day for want of half an hour. The 00:45 run clears MoF and still
# picks up the prior US/DE session; the 12:15 run clears the BoE, which would otherwise
# wait ~13 hours for the following midnight. Both runs are idempotent.
# Cron is fixed-UTC while ET/CET/BST shift, so these sit ~1h late in winter — the offsets
# are chosen with enough slack to absorb that plus GitHub's scheduler jitter (runs at :00
# queue worst, hence :45/:15).
on:
  schedule:
    - cron: "45 0 * * *"       # 00:45 UTC — after MoF JGB (09:30 JST, T+1)
    - cron: "15 12 * * *"      # 12:15 UTC — after BoE GLC (noon London, T+1)
  workflow_dispatch: {}         # manual trigger (any branch)

permissions:
  contents: write        # commit the accumulating Bund per-ISIN store

concurrency:
  group: daily-term-premium
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45          # whole-job backstop so a hung run can't block for hours
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Refresh data + rebuild atlas (fast filter-forward path)
        timeout-minutes: 25       # fetch + filter-forward rebuild normally ~4-5 min
        env:
          PYTHONPATH: ${{ github.workspace }}
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # optional: enables the TIPS-noise gauge + reliable Kim-Wright
        run: python -m scheduler.daily_update
      - name: Export to Supabase + publish Atlas (inert without secrets)
        timeout-minutes: 15       # Supabase upsert + upload normally ~3-4 min; fail fast if it hangs
        env:
          PYTHONPATH: ${{ github.workspace }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_ATLAS_BUCKET: ${{ secrets.SUPABASE_ATLAS_BUCKET }}
        run: python -m scheduler.supabase_export
      - name: Commit the accumulating Bund per-ISIN store (if it grew)
        # The Bundesbank index publishes only the most recent ~5 monthly workbooks and
        # its per-ISIN yield archive drops a security ~4 years past maturity, so a
        # trading day that scrolls off cannot be re-fetched. Retaining the union here
        # is the ONLY way the Bund liquidity gauge ever accumulates a history.
        #
        # This step NEVER fails the job. Everything that matters -- refreshing the
        # sources, rebuilding the premia, the Supabase upsert and the Atlas publish --
        # has already succeeded by the time we get here, so failing the run over a git
        # race would report a successful publish as a failure and tempt a re-run that
        # repeats the whole ~15-minute build for nothing. (Six runs on 2026-08-20 did
        # exactly that, burning ~100 minutes: a bare `git push` was rejected because
        # commits landed on main mid-run.) A losing push is now rebased and retried;
        # if it still cannot land, the cross-section is simply re-fetched next run,
        # since the Bundesbank window is ~5 months wide and one missed day costs
        # nothing. --autostash is required because the rebuild leaves other tracked
        # files (viz/artifact.html, viz/data.json) modified and unstaged.
        continue-on-error: true
        run: |
          set +e
          git config user.name  "atlas-bot"
          git config user.email "noreply@anthropic.com"
          git add germany/data/bund_prices/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no new Bund cross-sections"
            exit 0
          fi
          git commit -m "Accumulate Bund per-ISIN cross-section [skip ci]" || exit 0
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
              && git push origin "HEAD:${GITHUB_REF_NAME}" \
              && { echo "Bund store pushed"; exit 0; }
            echo "push attempt $i lost a race with another commit; retrying"
            sleep $((i * 5))
          done
          echo "::warning::Bund per-ISIN store could not be pushed after 3 attempts; it will be re-fetched on the next run"
          exit 0
