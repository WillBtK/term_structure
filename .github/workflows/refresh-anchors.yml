name: Refresh neutral-anchor fallbacks

# Self-maintains the LIVING survey rungs of the neutral anchors by fetching their
# official sources on the GitHub runner (open egress) and committing refreshed CSVs.
# The Consensus Economics snapshots are a ONE-OFF purchase (history to Jul-2026), never
# refreshed; past their last release each anchor is carried by these public sources:
#   US  SPF (means) + NY Fed SME        UK  BoE Market Participants Survey (neutral)
#   DE  ECB SPF longer-term rate (mean)  CA  BoC Market Participants Survey
#   CH  KOF consensus                    JP  no public long-horizon rate survey: glides
#                                            to the BoJ-communicated neutral corridor
# Best-effort and non-fatal: a failed scrape keeps the committed file.

on:
  schedule:
    - cron: "0 6 * * 1"          # Mondays 06:00 UTC (weekly; the surveys are semi-annual/quarterly)
  workflow_dispatch: {}          # manual trigger + first-run verification

permissions:
  contents: write                # commit refreshed CSVs back to the branch

concurrency:
  group: refresh-anchors
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch Ferreira r* (JA) + Tankan 5y (best-effort; prints a preview)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m japan.fetch_neutral
      - name: Fetch Ferreira r* (EA) + ECB SPF longer-term (best-effort)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m germany.fetch_neutral
      - name: Fetch SPF BILL10/CPI10 (US endpoint cross-check)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m us.fetch_neutral
      - name: Fetch NY Fed SME 10y-average fed funds (US anchor bridge, 8 rounds/yr)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m us.fetch_sme
      - name: Fetch BoE MPS neutral rate (UK carry-forward)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m uk.fetch_neutral
      - name: Fetch BoC MPS neutral rate (CA carry-forward)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m canada.fetch_neutral
      - name: Fetch KOF Consensus medians (CH; public API, no account)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m switzerland.fetch_neutral
      - name: Commit refreshed anchor CSVs (if any changed)
        run: |
          git config user.name  "atlas-bot"
          git config user.email "noreply@anthropic.com"
          # stage first (git diff --quiet ignores UNtracked new files); then check the index
          git add japan/data/anchors/ferreira_rstar_jp.csv 2>/dev/null || true
          git add japan/data/anchors/tankan_infl_5y.csv 2>/dev/null || true
          git add germany/data/anchors/ferreira_rstar_ea.csv 2>/dev/null || true
          git add germany/data/anchors/ecb_spf_infl_lt.csv 2>/dev/null || true
          git add germany/data/anchors/ecb_spf_rate_lt.csv 2>/dev/null || true
          git add us/data/anchors/spf_bill10.csv us/data/anchors/spf_cpi10.csv 2>/dev/null || true
          git add us/data/anchors/spf_tbill_y1.csv us/data/anchors/spf_tbill_y2.csv 2>/dev/null || true
          git add us/data/anchors/sme_ffr.csv 2>/dev/null || true
          git add uk/data/anchors/boe_mps_neutral.csv 2>/dev/null || true
          git add canada/data/anchors/boc_mps_neutral.csv 2>/dev/null || true
          git add switzerland/data/anchors/kof_cpi_5y.csv switzerland/data/anchors/kof_3m_12m.csv 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Refresh neutral-anchor fallbacks (Ferreira r* JA/EA, Tankan 5y, ECB SPF) [skip ci]"
            git push
          else
            echo "no anchor changes"
          fi
