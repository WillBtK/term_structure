name: Refresh neutral-anchor fallbacks

# Self-maintains the PUBLIC fallback rungs of the neutral anchors — Ferreira r* (Fed
# FEDS Note; the JA and EA columns of one file), BoJ Tankan 5y inflation, and the ECB
# SPF longer-term expectation — by fetching their official sources on the GitHub runner
# (open egress) and committing any refreshed CSVs under japan/ and germany/data/anchors/.
# This is the half of each anchor that CAN be maintained; the Consensus snapshots beside
# them are frozen by design and never touched here. Best-effort and non-fatal: a failed scrape keeps the committed
# file. The proprietary Consensus CSVs are provided manually and are never touched here.
# These fallbacks only affect the published premium if Consensus is ever absent.

on:
  schedule:
    - cron: "0 6 * * 1"          # Mondays 06:00 UTC (weekly; the surveys are semi-annual/quarterly)
  workflow_dispatch: {}          # manual trigger + first-run verification

permissions:
  contents: write                # commit refreshed CSVs back to the branch

concurrency:
  group: refresh-anchors
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch Ferreira r* (JA) + Tankan 5y (best-effort; prints a preview)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m japan.fetch_neutral
      - name: Fetch Ferreira r* (EA) + ECB SPF longer-term (best-effort)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m germany.fetch_neutral
      - name: Commit refreshed anchor CSVs (if any changed)
        run: |
          git config user.name  "atlas-bot"
          git config user.email "noreply@anthropic.com"
          # stage first (git diff --quiet ignores UNtracked new files); then check the index
          git add japan/data/anchors/ferreira_rstar_jp.csv 2>/dev/null || true
          git add japan/data/anchors/tankan_infl_5y.csv 2>/dev/null || true
          git add germany/data/anchors/ferreira_rstar_ea.csv 2>/dev/null || true
          git add germany/data/anchors/ecb_spf_infl_lt.csv 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Refresh neutral-anchor fallbacks (Ferreira r* JA/EA, Tankan 5y, ECB SPF) [skip ci]"
            git push
          else
            echo "no anchor changes"
          fi
