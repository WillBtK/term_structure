name: Diagnose FedInvest Nov-2009 step

# TEMPORARY. There is a large, sudden drop in the UST nominal noise gauge between
# 2009-11-13 and 2009-11-16 (~72bp -> ~3bp overnight) that looks like a data/parsing
# artifact rather than a real liquidity event. This dumps the raw price table for both
# dates (and a couple of neighbours) so the cause can be diagnosed. Delete once resolved.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt html5lib
      - name: Check endpoint consistency for the call_date column
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'EOF'
          import pandas as pd
          from us.fetch_fedinvest import ENDPOINTS, _post, parse_price_table, nominal_coupon_bonds

          # Two "high" and two "low" dates from the recomputed store, alternating for no
          # date-economics reason -- test whether the two mirror endpoints disagree on
          # whether a CALL DATE column exists at all. Avoid a second independent
          # read_html call (needs bs4, not installed here) -- just grep the raw HTML for
          # the header text, and reuse parse_price_table for the parsed comparison.
          dates = ["2008-09-03", "2008-09-04", "2009-10-16", "2009-10-30"]
          for ds in dates:
              d = pd.Timestamp(ds)
              print(f"\n=== {ds} ===")
              for url in ENDPOINTS:
                  try:
                      html = _post(url, d)
                  except Exception as exc:
                      print(f"  {url}: FETCH FAILED {type(exc).__name__}: {exc}")
                      continue
                  has_call_header = "call date" in html.lower()
                  df = parse_price_table(html, d)
                  nb = nominal_coupon_bonds(df)
                  n_call = int(df["call_date"].notna().sum()) if "call_date" in df.columns else "N/A"
                  print(f"  {url}: html={len(html)}B has_call_header={has_call_header} "
                        f"parsed_rows={len(df)} nominal_coupon={len(nb)} rows_with_call_date={n_call}")
          EOF
