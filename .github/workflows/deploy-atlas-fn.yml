name: Deploy Atlas Edge Function

# One-time (and on-change) deploy of the public `atlas` Edge Function that serves
# the Term Premium Atlas as real text/html (Supabase Storage serves HTML as
# text/plain, so the raw Storage URL won't render — the function fixes that).
# The function reads live from Storage, so after this deploys ONCE it keeps
# serving the latest daily data with no further deploys.
#
# One-time owner setup: add a repo secret SUPABASE_ACCESS_TOKEN
#   (Supabase dashboard -> Account -> Access Tokens -> Generate new token).
# SUPABASE_URL is already set; the project ref is derived from it.
# Public URL after deploy: <SUPABASE_URL>/functions/v1/atlas

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-atlas-fn.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy the public atlas function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN not set — skipping deploy (add it in repo secrets to enable)."
            exit 0
          fi
          REF=$(printf '%s' "$SUPABASE_URL" | sed -E 's#https?://([^.]+)\..*#\1#')
          echo "Deploying 'atlas' to project ref: $REF"
          supabase functions deploy atlas --project-ref "$REF" --no-verify-jwt
          URL="${SUPABASE_URL%/}/functions/v1/atlas"
          echo "Public URL: $URL"
          echo "--- verifying served response headers (after short propagation wait) ---"
          sleep 8
          curl -sS -o /tmp/atlas_out -D - "$URL" | grep -i -E '^(HTTP/|content-type|x-atlas-fn|content-length)' || true
          echo "--- first 80 bytes of body ---"
          head -c 80 /tmp/atlas_out; echo
