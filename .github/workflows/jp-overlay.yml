name: Build Japan 1974+ history overlay

# TEMPORARY: MoF JGB data is only reachable from a GitHub runner (open egress), not the
# dev sandbox. Run the Japan 9y/10y historical overlay estimator on a runner and commit
# the resulting viz/history/japan_hist_tp.json (the 9y backfill that extends the JGB 10y
# term premium to 1974). Removed once the JSON is committed.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Estimate Japan 1974+ overlay
        env:
          PYTHONPATH: ${{ github.workspace }}
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: python -m japan.run_history_overlay
      - name: Commit japan_hist_tp.json
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add viz/history/japan_hist_tp.json
          if git diff --cached --quiet; then
            echo "no change to japan_hist_tp.json"
          else
            git commit -m "japan_hist_tp: 1974+ 9y/10y overlay (generated on runner)"
            git push origin HEAD:main
          fi
