name: Rebuild Germany 1972+ history overlay (obs/exp/tp)

# TEMPORARY: Bundesbank data is only reachable from a GitHub runner (open egress).
# Re-run the Germany historical overlay so germany_hist_tp.json carries the fitted yield
# (obs) and expected-rate path (exp) as well as the term premium — needed for the
# explorer to show Actual/Contribution for Germany back to 1972. Removed once committed.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Estimate Germany 1972+ overlay (obs/exp/tp)
        env:
          PYTHONPATH: ${{ github.workspace }}
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: python -m germany.run_history_overlay
      - name: Commit germany_hist_tp.json
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add viz/history/germany_hist_tp.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "germany_hist_tp: add fitted yield + expected path (obs/exp) for the explorer backfill"
            git push origin HEAD:main
          fi
