name: Rebuild Germany 1972+ history overlay (full curve)

# TEMPORARY: Bundesbank data is only reachable from a GitHub runner (open egress), not
# the dev sandbox. Re-run the Germany historical overlay estimator (now emitting the
# FULL term structure, 0.25y..10y) and commit the refreshed viz/history/germany_hist_tp.json.
# Removed once the JSON is committed.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Estimate Germany 1972+ overlay (full curve)
        env:
          PYTHONPATH: ${{ github.workspace }}
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: python -m germany.run_history_overlay
      - name: Commit germany_hist_tp.json
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add viz/history/germany_hist_tp.json
          if git diff --cached --quiet; then
            echo "no change to germany_hist_tp.json"
          else
            git commit -m "germany_hist_tp: full term structure (0.25y..10y) overlay (generated on runner)"
            git push origin HEAD:main
          fi
