<script>
function loadData(){
  // ── DATA ADAPTER ──────────────────────────────────────────────────────────
  // Today the (thinned) dataset is embedded in the #data-blob tag, because a
  // published Claude Artifact is sandboxed and cannot fetch an external host.
  // To move to a hosted backend (e.g. Supabase) later, replace the body of this
  // one function with a fetch returning the SAME schema — the canonical
  // Supabase-shaped table is viz/data_daily.parquet — and the charts below are
  // unchanged (make it async + await loadData() at the two call sites).
  return JSON.parse(document.getElementById('data-blob').textContent);
}
const DATA = loadData();
/* ============================================== THEME */
(function(){
  const btns = document.querySelectorAll('#themeToggle button');
  function apply(mode){
    if(mode === 'system'){ document.documentElement.removeAttribute('data-theme'); }
    else{ document.documentElement.setAttribute('data-theme', mode); }
    btns.forEach(b => b.classList.toggle('active', b.dataset.t === mode));
    window.dispatchEvent(new Event('themechange'));
  }
  btns.forEach(b => b.addEventListener('click', () => apply(b.dataset.t)));
  apply('system');
})();
/* ============================================== HELPERS */
function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function fmt(v, d=3){ if(v===null||v===undefined||isNaN(v)) return '—'; return v.toFixed(d); }
function fmtSigned(v, d=1){ if(v===null||v===undefined||isNaN(v)) return '—'; return (v>=0?'+':'')+v.toFixed(d); }
function signClass(v){ return v>=0 ? 'sign-pos' : 'sign-neg'; }
const tt = document.getElementById('tooltip');
function showTip(evt, html){
  tt.innerHTML = html; tt.classList.add('show');
  const x = evt.clientX, y = evt.clientY, pad = 16;
  tt.style.left='0px'; tt.style.top='0px';
  const rect = tt.getBoundingClientRect();
  let left = x+pad, top = y+pad;
  if(left+rect.width > window.innerWidth-10) left = x-rect.width-pad;
  if(top+rect.height > window.innerHeight-10) top = y-rect.height-pad;
  tt.style.left=left+'px'; tt.style.top=top+'px';
}
function hideTip(){ tt.classList.remove('show'); }
const SVGNS='http://www.w3.org/2000/svg';
function el(tag, attrs){ const e=document.createElementNS(SVGNS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); return e; }
function scaleLinear(domain,range){ const [d0,d1]=domain,[r0,r1]=range; const den=(d1-d0)||1; return v=>r0+(v-d0)/den*(r1-r0); }
function niceTicks(min,max,count){
  const span=(max-min)||1, step0=span/count, mag=Math.pow(10,Math.floor(Math.log10(step0))), norm=step0/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag; const ticks=[]; let t=Math.ceil(min/step)*step;
  for(;t<=max+1e-9;t+=step) ticks.push(Math.round(t*1e6)/1e6); return ticks;
}
function h(tag, attrs, kids){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){ if(k==='class') e.className=attrs[k]; else if(k==='html') e.innerHTML=attrs[k]; else e.setAttribute(k,attrs[k]); }
  if(kids) (Array.isArray(kids)?kids:[kids]).forEach(c=> c!=null && e.appendChild(typeof c==='string'?document.createTextNode(c):c));
  return e;
}
const COL = ()=>({blue:cssVar('--blue'),orange:cssVar('--orange'),teal:cssVar('--teal'),purple:cssVar('--purple'),crimson:cssVar('--crimson'),orangeSoft:cssVar('--orange-soft'),ink:cssVar('--ink'),muted:cssVar('--muted'),faint:cssVar('--faint'),line:cssVar('--line'),line2:cssVar('--line-2'),surface:cssVar('--surface')});

/* ============================================== LINE CHART (crosshair) */
// opts: {series:[{label,color,dash,pts:[[x,y]]}], yZero, yFmt, xFmt, xTipFmt, height, hideXaxis,
//        breaks:[{x,label}], onHover(xv), onLeave()}   (breaks/onHover/onLeave are additive linked-chart hooks)
const CHARTS=[];
function lineChart(mount, opts){
  const render=()=>{ mount.innerHTML=''; drawLine(mount, opts); };
  render(); CHARTS.push(render);
}
function drawLine(mount, o){
  const C=COL();
  const W = mount.clientWidth || 560;
  const m={t:16,r:16,b:24,l:38};
  const all = o.series.flatMap(s=>s.pts);
  const xs = all.map(p=>p[0]), ys = all.map(p=>p[1]);
  let ymin = Math.min(...ys), ymax = Math.max(...ys);
  if(o.yZero){ ymin=Math.min(ymin,0); ymax=Math.max(ymax,0); }
  const pad=(ymax-ymin)*0.08||1; ymin-=pad; ymax+=pad;
  const xmin=Math.min(...xs), xmax=Math.max(...xs);
  const plotW=W-m.l-m.r;
  const H = o.height || 200;
  const plotH=H-m.t-m.b;
  const sx=scaleLinear([xmin,xmax],[m.l,m.l+plotW]);
  const sy=scaleLinear([ymin,ymax],[m.t+plotH,m.t]);
  const svg=el('svg',{width:'100%',height:H,viewBox:`0 0 ${W} ${H}`,preserveAspectRatio:'none'});
  // greedy label-collision guard: a label is drawn only if its x-span is clear
  const labelSpans=[];
  function placeLabel(cx, text, anchor, y, color){
    const w=text.length*5.2, x0=anchor==='start'?cx:cx-w/2, x1=x0+w;
    for(const [a,b] of labelSpans){ if(x1>a-4 && x0<b+4) return; }
    labelSpans.push([x0,x1]);
    const tx=el('text',{x:cx,y:y||(m.t+9),'text-anchor':anchor}); tx.setAttribute('fill',color||C.faint);
    tx.style.fontSize='9px'; tx.textContent=text; svg.appendChild(tx);
  }
  // additive: shaded episode bands (behind everything), with an optional top label
  (o.bands||[]).forEach(bd=>{
    const a=Math.max(bd.x0,xmin), b=Math.min(bd.x1,xmax); if(b<=a) return;
    const x0=sx(a), x1=sx(b);
    svg.appendChild(el('rect',{x:x0,y:m.t,width:Math.max(1,x1-x0),height:plotH,
      fill:bd.fill||C.line2,opacity:bd.opacity!=null?bd.opacity:0.55}));
    if(bd.edge){ svg.appendChild(el('line',{x1:x1,x2:x1,y1:m.t,y2:m.t+plotH,stroke:bd.edgeColor||C.faint,'stroke-width':1,'stroke-dasharray':'2 2',opacity:0.85})); }
    if(bd.label){ const left=bd.labelAt==='left';
      placeLabel(left?x0+4:(x0+x1)/2, bd.label, left?'start':'middle', m.t+9, bd.labelColor||C.faint); }
  });
  const yt=niceTicks(ymin,ymax,4);
  const stepA = yt.length>1 ? Math.abs(yt[1]-yt[0]) : 1;
  const dec = stepA<0.1?2 : stepA<1?1 : 0;
  const axFmt = v => (Math.abs(v)<1e-9?'0':v.toFixed(dec));
  const tipFmt = o.yFmt || (v=>fmt(v,2));
  yt.forEach(t=>{
    const y=sy(t);
    svg.appendChild(el('line',{x1:m.l,x2:m.l+plotW,y1:y,y2:y,stroke:C.line2,'stroke-width':1}));
    const tx=el('text',{x:m.l-6,y:y+3,'text-anchor':'end'}); tx.textContent=axFmt(t); svg.appendChild(tx);
  });
  if(ymin<0&&ymax>0){ const y0=sy(0); svg.appendChild(el('line',{x1:m.l,x2:m.l+plotW,y1:y0,y2:y0,stroke:C.faint,'stroke-width':1.2})); }
  // additive: regime breakpoints as dashed verticals + label
  (o.breaks||[]).forEach(b=>{

    if(b.label) placeLabel(x+3, b.label, 'start', m.t+9, C.faint);
  });
  if(!o.hideXaxis){
    niceTicks(xmin,xmax,Math.min(6,Math.round(plotW/90))).forEach(t=>{
      if(t<xmin-0.5||t>xmax+0.5) return;
      const x=sx(t); const tx=el('text',{x:x,y:H-8,'text-anchor':'middle'}); tx.textContent=(o.xFmt?o.xFmt(t):Math.round(t)); svg.appendChild(tx);
    });
  }
  o.series.forEach(s=>{
    if(!s.pts.length) return;
    const d = s.pts.map((p,i)=> (i?'L':'M')+sx(p[0]).toFixed(1)+' '+sy(p[1]).toFixed(1)).join(' ');
    svg.appendChild(el('path',{d,fill:'none',stroke:s.color,'stroke-width':s.width||2,'stroke-dasharray':s.dash||'','stroke-linejoin':'round','stroke-linecap':'round',opacity:s.dash?0.9:1}));
    const lp=s.pts[s.pts.length-1];
    if(!s.dash) svg.appendChild(el('circle',{cx:sx(lp[0]),cy:sy(lp[1]),r:3,fill:s.color}));
  });
  const cross=el('line',{x1:0,x2:0,y1:m.t,y2:m.t+plotH,stroke:C.faint,'stroke-width':1,opacity:0});
  svg.appendChild(cross);
  const dots=o.series.map(s=>{ const c=el('circle',{r:3.5,fill:s.color,stroke:C.surface,'stroke-width':1.5,opacity:0}); svg.appendChild(c); return c; });
  const rect=el('rect',{x:m.l,y:m.t,width:plotW,height:plotH,fill:'transparent'});
  svg.appendChild(rect);
  const xvals=[...new Set(xs)].sort((a,b)=>a-b);
  rect.addEventListener('mousemove',ev=>{
    const bb=svg.getBoundingClientRect(); const px=(ev.clientX-bb.left)*(W/bb.width);
    const xv=xvals.reduce((a,b)=>Math.abs(sx(b)-px)<Math.abs(sx(a)-px)?b:a,xvals[0]);
    cross.setAttribute('x1',sx(xv)); cross.setAttribute('x2',sx(xv)); cross.setAttribute('opacity',0.5);
    let rows='';
    o.series.forEach((s,i)=>{

    if(o.onHover) o.onHover(xv);
  });
  rect.addEventListener('mouseleave',()=>{ cross.setAttribute('opacity',0); dots.forEach(d=>d.setAttribute('opacity',0)); hideTip(); if(o.onLeave) o.onLeave(); });
  mount.appendChild(svg);
}
function legend(items){

/* Reusable double-ended time-range slider. Renders a dual-track into `mount` from an
   ascending x-array (+ optional date labels) and calls onRange(xlo,xhi) on drag.
   Built once per chart; the chart's render() reads the window and filters its series. */
function rangeSlider(mount, xArr, dates, onRange){
  const N=xArr.length; mount.innerHTML='';
  if(N<3){ return; }
  let lo=0, hi=N-1;
  const wrap=h('div',{class:'range-slider'});
  const label=h('div',{class:'range-label'}); wrap.appendChild(label);
  const track=h('div',{class:'dual-track'}); track.appendChild(h('div',{class:'track-bg'}));
  const fill=h('div',{class:'track-fill'}); track.appendChild(fill);
  const loIn=h('input',{type:'range',min:0,max:N-1,step:1,value:0});
  const hiIn=h('input',{type:'range',min:0,max:N-1,step:1,value:N-1});
  loIn.setAttribute('aria-label','Range start'); hiIn.setAttribute('aria-label','Range end');
  track.appendChild(loIn); track.appendChild(hiIn); wrap.appendChild(track); mount.appendChild(wrap);
  const lab=i=>dates?dates[i]:String(Math.round(xArr[i]));
  function upd(fire){ label.textContent=lab(lo)+'  –  '+lab(hi);
    const pc=v=>100*v/((N-1)||1); fill.style.left=pc(lo)+'%'; fill.style.width=(pc(hi)-pc(lo))+'%';
    if(fire) onRange(xArr[lo], xArr[hi]); }
  loIn.addEventListener('input',()=>{ lo=Math.min(+loIn.value,hi-1); loIn.value=lo; upd(true); });
  hiIn.addEventListener('input',()=>{ hi=Math.max(+hiIn.value,lo+1); hiIn.value=hi; upd(true); });
  upd(false);
}

async function downloadCsv(filename, text, note){
  note.textContent='';
  let downloads=null;
  try{ downloads = (window.claude && claude.use) ? await claude.use('downloads') : null; }catch(e){ downloads=null; }
  if(!downloads){ note.textContent='Download isn’t available in this view — open the artifact on claude.ai to save the CSV.'; return; }
  const attempt = async name => downloads.save({filename:name, data:text});
  try{ await attempt(filename); note.textContent='Saved '+filename+'.'; }
  catch(err){
    const code = err && err.code;
    if(code==='extension_not_enabled'){
      try{ const alt=filename.replace(/\.csv$/,'.txt'); await attempt(alt); note.textContent='Saved as '+alt+' (CSV content).'; }
      catch(e2){ note.textContent = e2 && e2.code==='declined' ? 'Save cancelled.' : 'Download unavailable in this view.'; }
    } else if(code==='declined'){ note.textContent='Save cancelled.'; }

  }
}

/* ------------------------------------------------ 3b-DE. GERMANY — THE LONG VIEW (1972+) */
(function(){
  const DE=DATA.countries.DE; if(!DE) return;
  const b=DE.instruments && DE.instruments.nominal; if(!b || !b.history) return;
  const H=b.history, tenors=Object.keys(H.tp||{}); if(!tenors.length) return;
  const hasSplice=!!(H.tp_aligned && H.align_offset);
  panel('degermanyhist','Historical lens','Germany — the long view (1972+)',
    ['The daily Bund term premium in this atlas starts in <b>1997</b>, where Bundesbank’s daily curve begins — but their <b>monthly</b> curve runs back to <b>1972</b>. We push the same decomposition (with the mean-reversion floor) back over the full Deutsche-Mark-and-euro history. The historical fit uses a <b>full-sample long-run mean</b> that the 15–19% rates of the 1970s–80s drag upward, biasing its <i>level</i> below the modern series — so by default we <b>join</b> it to the production line with a one-time level match at the seam (matched on a month-end basis, the historical series’ convention) and show one continuous series (the 1970s <i>shape</i> is preserved; only the level is shifted). Toggle to the raw as-estimated exhibit to see the gap.']);
  const s=M.lastChild;
  const DH={view: hasSplice?'splice':'raw'};
  const bar=h('div',{class:'ctrlbar'});
  const g=h('div',{class:'grp'}); g.appendChild(h('span',{class:'eyebrow'},'Maturity'));

  sel.onchange=()=>{ DH.tenor=sel.value; render(); }; g.appendChild(sel); bar.appendChild(g);
  if(hasSplice){
    const gv=h('div',{class:'grp'}); gv.appendChild(h('span',{class:'eyebrow'},'View'));
    const seg=h('div',{class:'seg'});
    [['splice','Level-aligned splice'],['raw','Raw exhibit']].forEach(([v,lab])=>{
      const bt=h('button',null,lab); if(v===DH.view)bt.classList.add('active');
      bt.onclick=()=>{ DH.view=v; [...seg.children].forEach(x=>x.classList.toggle('active',x===bt)); render(); };
      seg.appendChild(bt); }); gv.appendChild(seg); bar.appendChild(gv);
  }
  s.appendChild(bar);
  const c=h('div',{class:'card'}); const ct=h('div',{class:'card-title'}); c.appendChild(ct);

  DH.xlo=H.x[0]; DH.xhi=H.x[H.x.length-1];
  const call=h('div',{class:'callout teal'}); c.appendChild(call);
  const seamX=b.x[0];                                    // production start = splice join
  function stats(t, vals){
    let sum=0,n=0,pk=-1e9,pkd=null,last=null;
    for(let i=0;i<vals.length;i++){ const y=vals[i]; if(y==null) continue; last=y;
      if(H.x[i]>=1973 && H.x[i]<1986){ sum+=y; n++; }
      if(y>pk){ pk=y; pkd=H.dates[i]; } }
    return {avg:n?sum/n:null, peak:pk, peakDate:pkd, last:last};
  }
  function render(){
    const t=DH.tenor, CC=COL(), inWin=p=>p[0]>=DH.xlo-1e-6&&p[0]<=DH.xhi+1e-6;

      const al=H.tp_aligned[t]||[], off=(H.align_offset[t]!=null?H.align_offset[t]:0);
      const pre=H.x.map((x,i)=>[x, al[i]]).filter(p=>p[1]!=null && p[0]<seamX && inWin(p));
      ct.textContent=`Germany ${t}-year term premium — 1972+ spliced with the daily production series`;
      cn.textContent='Percent. One continuous series: daily production (1997+) joined to the 1972+ monthly history, shifted by a one-time level match at the seam (month-end). Drag the handles below to zoom.';
      series=[
        {label:`Historical 1972–97 (level-matched +${fmt(off,2)}%)`,color:CC.orange,width:2.2,pts:pre},
        {label:'Daily production (1997+)',color:CC.blue,width:2.0,pts:modern}];
      lg.innerHTML=''; lg.appendChild(legend(series.map(sr=>({label:sr.label,color:sr.color}))));
      box.innerHTML=''; drawLine(box,{height:300,yZero:true,yFmt:v=>fmt(v,2)+'%',xFmt:xYear,xTipFmt:xFmtDay,
        bands:[{x0:ym(1979,8),x1:ym(1985,6),fill:CC.orange,opacity:0.10,label:'2nd oil shock'}],
        series});
      const st=stats(t, al);
      if(st.avg!=null)
        call.innerHTML=`Joined to the production line by a <b>one-time +${fmt(off,2)}%</b> level match at the seam (${H.align_month||'the earliest overlap month'}, month-end). On this basis the German ${t}-year premium averaged <b>${fmt(st.avg,2)}%</b> across the <b>1973–85</b> high-inflation era, peaking near <b>${fmt(st.peak,2)}%</b> (${st.peakDate?st.peakDate.slice(0,7):''}) — broadly in line with the US in the same era. The splice shifts only the <b>level</b> (a single per-tenor constant); the 1970s <b>shape</b> is the raw historical fit. Read the deep-past level as indicative.`;
    } else {
      const hist=H.x.map((x,i)=>[x, H.tp[t]?H.tp[t][i]:null]).filter(p=>p[1]!=null&&inWin(p));
      ct.textContent=`Germany ${t}-year term premium — 1972+ monthly historical exhibit vs the daily production series`;
      cn.textContent='Percent. Solid = full-sample monthly historical fit (1972+, as estimated); dashed = the daily production line (1997+). The vertical gap is the full-sample-θ level bias. Drag the handles below to zoom.';
      series=[
        {label:'Historical (1972+, as-estimated)',color:CC.orange,width:2.2,pts:hist},
        {label:'Daily production (1997+, atlas default)',color:CC.blue,width:1.6,dash:'5 4',pts:modern}];
      lg.innerHTML=''; lg.appendChild(legend(series.map(sr=>({label:sr.label,color:sr.color,dash:!!sr.dash}))));
      box.innerHTML=''; drawLine(box,{height:300,yZero:true,yFmt:v=>fmt(v,2)+'%',xFmt:xYear,xTipFmt:xFmtDay,
        bands:[{x0:ym(1979,8),x1:ym(1985,6),fill:CC.orange,opacity:0.10,label:'2nd oil shock'}],
        series});
      const st=stats(t, H.tp[t]||[]);
      if(st.avg!=null)
        call.innerHTML=`As estimated, the historical ${t}y premium averaged <b>${fmt(st.avg,2)}%</b> over <b>1973–85</b> and sits systematically <b>below</b> the production line — the full-sample long-run mean (dragged up by the 1970s–80s) biases the historical expected-rate path high and its premium low. Switch to <b>Level-aligned splice</b> to remove this constant offset and read one continuous series.`;
    }
  }
  render(); CHARTS.push(render);
  rangeSlider(sliderMount, H.x, H.dates, (lo,hi)=>{ DH.xlo=lo; DH.xhi=hi; render(); });
})();

  rangeSlider(sliderMount, nz.x, nz.dates, (lo,hi)=>{ NZ.xlo=lo; NZ.xhi=hi; render(); });
  const call=h('div',{class:'callout'});
  call.innerHTML='The gauge peaks at <b>~45 bp in December 2008</b> — the post-Lehman TIPS freeze, when the market dislocated so badly that breakevens turned negative — and sits near <b>8 bp</b> today. It is independent of any term-premium model, so it doubles as a data-quality check on the real curve.';
  s.appendChild(call);
})();

/* ------------------------------------------------ 3f. GERMAN BUND LIQUIDITY GAUGE (noise) */

  const de=DATA.countries.DE; const nz=de&&de.bund_noise; if(!nz) return;
  panel('liquidityde','Market quality','German Bund liquidity — curve-fitting “noise”',
    ['The same Hu–Pan–Wang “noise” gauge applied to the German Bund cross-section: per day, fit a smooth curve to the yields of every outstanding Bund/Bobl/Schatz (Bundesbank per-security reference prices) and take the <b>RMS deviation</b>. Low when the market is liquid and every issue sits on the curve; higher when individual bonds scatter. A free daily illiquidity read on the euro-area benchmark, built only from public security-level data — the DE analogue of the US TIPS gauge above.']);

  const c=h('div',{class:'card'});
  c.appendChild(h('div',{class:'card-title'},'German Bund cross-sectional fitting noise'));

  const box=h('div'); c.appendChild(box);
  const sliderMount=h('div'); c.appendChild(sliderMount); s.appendChild(c);

/* ------------------------------------------------ 3g. GLOBAL TERM-PREMIUM FACTOR */
(function(){
  const gf=DATA.global_factor; if(!gf || !gf.G || !gf.G.length) return;
  const ladder=gf.pca_ladder||[];
  panel('globalfactor','Global cycle','A common term-premium cycle across bond markets',
    ['Across four major markets (US, Germany, Japan and the UK — Switzerland is left out, its government-bond market too thin to belong in a common cycle) the 10-year term premia move largely <b>together</b>: a single common factor (the first principal component) explains <b>'+(ladder[0]||0).toFixed(0)+'%</b> of the variation'+(ladder[1]?' — the second explains only '+ladder[1].toFixed(0)+'%, so one global factor suffices':'')+'. We extract that factor with a dynamic factor model on the monthly term-premium series back to <b>1974</b> (Germany reaches 1972 and Japan 1974 via the historical splices) and read each market as <b>global cycle + a local residual</b>. The residual — how cheap or rich a curve sits <b>versus the global cycle</b> — is a relative-value signal (see note).']);
  const s=M.lastChild;
  const CC0=COL();
  // variance-share readout
  const shr=gf.order.map(cc=>cc+' '+gf.markets[cc].share.toFixed(0)+'%').join('  ·  ');
  // correlation of the factor with the US 10y TP, computed from the payload
  const corr=(a,b)=>{ if(!a||!b) return null; const xs=[],ys=[];
    for(let i=0;i<a.length;i++){ if(a[i]!=null&&b[i]!=null){xs.push(a[i]);ys.push(b[i]);} }
    const n=xs.length; if(n<3) return null;
    const mx=xs.reduce((s,v)=>s+v,0)/n, my=ys.reduce((s,v)=>s+v,0)/n;
    let sxy=0,sx=0,sy=0; for(let i=0;i<n;i++){const dx=xs[i]-mx,dy=ys[i]-my; sxy+=dx*dy; sx+=dx*dx; sy+=dy*dy;}
    return (sx>0&&sy>0)? sxy/Math.sqrt(sx*sy):null; };
  const usCorr=corr(gf.G, gf.markets.US&&gf.markets.US.observed);
  s.appendChild(h('div',{class:'callout teal',html:'<b>How global is each market?</b> Share of each 10y term premium explained by the common factor — '+shr+'.'+(usCorr!=null?' The factor tracks the <b>US 10-year term premium</b> at r='+(usCorr<0?'−':'+')+Math.abs(usCorr).toFixed(2)+' — a rates cycle centred on the US.':'')}));
  const GF={mkt:'US', xlo:gf.x[0], xhi:gf.x[gf.x.length-1]};
  // Card A — the global factor
  const cA=h('div',{class:'card'});
  cA.appendChild(h('div',{class:'card-title'},'The global term-premium factor (PC1, standardized)'));
  cA.appendChild(h('div',{class:'card-note'},'Common cycle across US, Germany, Japan and the UK 10y term premia (monthly, from 1974). Unitless (standardized); read the shape, not the level. Drag the handles below to zoom.'));
  const boxA=h('div'); cA.appendChild(boxA); s.appendChild(cA);
  // Card B — a market vs the global cycle
  const barB=h('div',{class:'ctrlbar'});
  const gB=h('div',{class:'grp'}); gB.appendChild(h('span',{class:'eyebrow'},'Market'));
  const segB=h('div',{class:'seg'});
  gf.order.forEach(cc=>{ const b=h('button',null,cc); if(cc===GF.mkt)b.classList.add('active');
    b.onclick=()=>{ GF.mkt=cc; [...segB.children].forEach(x=>x.classList.toggle('active',x===b)); render(); };
    segB.appendChild(b); }); gB.appendChild(segB); barB.appendChild(gB); s.appendChild(barB);
  const cB=h('div',{class:'card'}); const ctB=h('div',{class:'card-title'}); const cnB=h('div',{class:'card-note'});
  cB.appendChild(ctB); cB.appendChild(cnB); const lgB=h('div'); cB.appendChild(lgB); const boxB=h('div'); cB.appendChild(boxB);
  const sliderMount=h('div'); cB.appendChild(sliderMount); s.appendChild(cB);
  s.appendChild(h('div',{class:'callout',html:'<b>The local residual is a relative-value signal.</b> A market trading <b>cheap</b> versus the global cycle (observed above the fitted line) has tended to <b>outperform</b> the others over the next month — in the research backtest the residual carries relative-value information beyond a naive term-spread carry signal. A construct-validity diagnostic on synthetic duration-hedged excess returns across the four markets — not a tradeable strategy (no costs, no real hedging). See <i>FINDINGS_global_factor</i>.'}));
  rangeSlider(sliderMount, gf.x, gf.dates, (lo,hi)=>{ GF.xlo=lo; GF.xhi=hi; render(); });
  function render(){
    const CC=COL(), inWin=p=>p[0]>=GF.xlo-1e-6&&p[0]<=GF.xhi+1e-6;
    const gpts=gf.x.map((x,i)=>[x,gf.G[i]]).filter(p=>p[1]!=null&&inWin(p));
    boxA.innerHTML=''; drawLine(boxA,{height:250,yFmt:v=>fmt(v,1),xFmt:xYear,xTipFmt:xFmtDay,
      series:[{label:'Global factor (PC1)',color:CC.blue,width:2.2,pts:gpts}]});
    const m=gf.markets[GF.mkt];
    ctB.textContent=`${DATA.countries[GF.mkt].name} — 10y term premium vs the global cycle`;
    cnB.textContent='Percent, monthly. Observed 10y term premium vs the global-cycle-implied fitted (α+β·G); the gap is the local residual (+ = cheap vs the cycle).';
    // clip to the market's own observed sample (don't show fitted before the market existed)
    let x0=gf.x[gf.x.length-1];
    for(let i=0;i<m.observed.length;i++){ if(m.observed[i]!=null){ x0=gf.x[i]; break; } }
    const obs=gf.x.map((x,i)=>[x,m.observed[i]]).filter(p=>p[1]!=null&&inWin(p));
    const fit=gf.x.map((x,i)=>[x,m.fitted[i]]).filter(p=>p[1]!=null&&inWin(p)&&p[0]>=x0-1e-6);
    lgB.innerHTML=''; lgB.appendChild(legend([{label:'Observed 10y TP',color:CC[CCOL[GF.mkt]]||CC.blue},
      {label:'Global-cycle fitted (α+β·G)',color:CC.faint,dash:true}]));
    boxB.innerHTML=''; drawLine(boxB,{height:250,yZero:true,yFmt:v=>fmt(v,2)+'%',xFmt:xYear,xTipFmt:xFmtDay,
      series:[{label:'Observed',color:CC[CCOL[GF.mkt]]||CC.blue,width:2.2,pts:obs},
              {label:'Fitted',color:CC.faint,dash:'5 4',pts:fit}]});
  }
  render(); CHARTS.push(render);
})();

/* ------------------------------------------------ 4. DATA / METHOD */
(function(){
  panel('data','The data','Method & download',
    ['Each curve is fitted with a single arbitrage-free Nelson–Siegel model extended with the Christensen–Rudebusch shadow rate (so it respects each market’s effective lower bound), estimated by extended-Kalman QML on a modern regime-clean sample. The expected-rate path is anchored by a calibrated <b>~3.5-year mean-reversion floor</b> on the physical persistence (see the note below). The term premium shown is the <b>realised</b> premium: the observed yield minus the model’s expected average future short rate. Real curves (US TIPS, UK index-linked) drop the lower bound entirely.']);
  const s=M.lastChild;
  // summary table
  const c=h('div',{class:'card'});
  c.appendChild(h('div',{class:'card-title'},'Coverage & latest 10-year term premium'));
  const tw=h('div',{class:'twrap'}); const tb=h('table');
  tb.appendChild(h('thead',null,h('tr',null,['Market','Instrument','Sample','ELB','10y TP','10y yield'].map(x=>h('th',null,x)))));
  const body=h('tbody');
  DATA.order.forEach(cc=>{ Object.entries(DATA.countries[cc].instruments).forEach(([k,b])=>{
    const tp=lastVal(b,'tp','10'), y=lastVal(b,'obs','10');
    const tr=h('tr',null,[
      h('td',null,DATA.countries[cc].name),
      h('td',null,k==='real'?'Inflation-linked':'Nominal'),
      h('td',null,b.sample),
      h('td',null,b.elb==null?'—':fmt(b.elb,2)+'%'),
      h('td',{class:tp==null?'':(tp>=0?'sign-pos':'sign-neg')}, tp==null?'—':fmtSigned(tp,2)),
      h('td',null,y==null?'—':fmt(y,2))]);
    body.appendChild(tr);
  }); });
  tb.appendChild(body); tw.appendChild(tb); c.appendChild(tw); s.appendChild(c);
  // interpretation caveat
  const cav=h('div',{class:'callout orange'});
  cav.innerHTML='<b>Anchoring the expected-rate path.</b> A yields-only model tends to a near-unit-root, so the expected-average short rate would track <b>today’s</b> policy rate and the term premium would degenerate into the term spread (collapsing to deeply negative in the 2022–23 hiking cycle). We instead impose a calibrated <b>~3.5-year mean-reversion</b> so the expected path reverts to its long-run mean — calibrated on the US against the <b>SF Fed Christensen–Rudebusch</b> series (10y correlation 0.80, identical latest value 1.19%) and applied uniformly to every market. One residual caveat: a yields-only model still cannot see central-bank bond purchases, so it does not separately identify QE’s compression of the premium.';
  s.appendChild(cav);
  // historical-extension caveat
  const cav2=h('div',{class:'callout orange'});
  cav2.innerHTML='<b>The extended history (pre-estimation-sample).</b> Observed yields run to each daily source’s start (US 1961, UK 1979, Japan 1974), but the model <b>parameters</b> are fit on each market’s modern sample (US 1987+, UK 1992+, …). Before that boundary — shaded orange in the Explorer — the decomposition applies <b>extrapolated</b> parameters. The mean-reversion floor keeps this well-behaved even at 1970s–80s rate levels (no blow-up), and a separate 2-regime model agrees closely there (see the Great-Inflation section — correlation 0.91). The shared caveat is subtler: both anchor the expected-rate path to a <b>low modern-era long-run mean</b>, so if the 1970s market expected persistently higher rates, both <b>overstate</b> the premium — read the deep-past level as “high and positive”, and rely on event-window <b>changes</b> (which difference the bias out) more than the absolute level.';
  s.appendChild(cav2);
  // download
  const c2=h('div',{class:'card'});
  c2.appendChild(h('div',{class:'card-title'},'Download the full series'));
  c2.appendChild(h('div',{class:'card-note'},'Long-format CSV: market, instrument, tenor, date, actual yield, expected rate, term premium (percent).'));
  const btn=h('button',{class:'btn'},'Download CSV'); c2.appendChild(btn);
  const dnote=h('div',{class:'hint'}); c2.appendChild(dnote); s.appendChild(c2);
  function buildCsv(){
    const rows=[['market','instrument','tenor_years','date','actual_yield_pct','expected_rate_pct','term_premium_pct']];
    DATA.order.forEach(cc=>Object.entries(DATA.countries[cc].instruments).forEach(([k,b])=>{
      b.tenors.forEach(t=> b.dates.forEach((d,i)=>{
        const o=b.obs[t][i],e=b.exp[t][i],p=b.tp[t][i];
        if(o==null&&e==null&&p==null) return;
        rows.push([cc,k,t,d,o==null?'':o,e==null?'':e,p==null?'':p]);
      }));
    }));
    return rows.map(r=>r.join(',')).join('\n');
  }
  btn.onclick=()=>{ downloadCsv('term_premium_atlas.csv', buildCsv(), dnote); };
})();
