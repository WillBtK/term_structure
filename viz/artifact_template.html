<script>
function loadData(){
  // ── DATA ADAPTER ──────────────────────────────────────────────────────────
  // Today the (thinned) dataset is embedded in the #data-blob tag, because a
  // published Claude Artifact is sandboxed and cannot fetch an external host.
  // To move to a hosted backend (e.g. Supabase) later, replace the body of this
  // one function with a fetch returning the SAME schema — the canonical
  // Supabase-shaped table is viz/data_daily.parquet — and the charts below are
  // unchanged (make it async + await loadData() at the two call sites).
  return JSON.parse(document.getElementById('data-blob').textContent);
}
const DATA = loadData();
/* ============================================== THEME */
(function(){
  const btns = document.querySelectorAll('#themeToggle button');
  function apply(mode){
    if(mode === 'system'){ document.documentElement.removeAttribute('data-theme'); }
    else{ document.documentElement.setAttribute('data-theme', mode); }
    btns.forEach(b => b.classList.toggle('active', b.dataset.t === mode));
    window.dispatchEvent(new Event('themechange'));
  }
  btns.forEach(b => b.addEventListener('click', () => apply(b.dataset.t)));
  apply('system');
})();
/* ============================================== HELPERS */
function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function fmt(v, d=3){ if(v===null||v===undefined||isNaN(v)) return '—'; return v.toFixed(d); }
function fmtSigned(v, d=1){ if(v===null||v===undefined||isNaN(v)) return '—'; return (v>=0?'+':'')+v.toFixed(d); }
function signClass(v){ return v>=0 ? 'sign-pos' : 'sign-neg'; }
const tt = document.getElementById('tooltip');
function showTip(evt, html){
  tt.innerHTML = html; tt.classList.add('show');
  const x = evt.clientX, y = evt.clientY, pad = 16;
  tt.style.left='0px'; tt.style.top='0px';
  const rect = tt.getBoundingClientRect();
  let left = x+pad, top = y+pad;
  if(left+rect.width > window.innerWidth-10) left = x-rect.width-pad;
  if(top+rect.height > window.innerHeight-10) top = y-rect.height-pad;
  tt.style.left=left+'px'; tt.style.top=top+'px';
}
function hideTip(){ tt.classList.remove('show'); }
const SVGNS='http://www.w3.org/2000/svg';
function el(tag, attrs){ const e=document.createElementNS(SVGNS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); return e; }
function scaleLinear(domain,range){ const [d0,d1]=domain,[r0,r1]=range; const den=(d1-d0)||1; return v=>r0+(v-d0)/den*(r1-r0); }
function niceTicks(min,max,count){

function rangeSlider(mount, xArr, dates, onRange){

  if(s<=0) return a2;                                   // spot
  const a1=src[TKEY(s)]; if(!a1) return null;
  const w2=(s+t)/t, w1=s/t;
  return a2.map((v,i)=>(v==null||a1[i]==null)?null:v*w2-a1[i]*w1);
}
function fwdPts(block, measure, start, tenor){
  const a=fwdArr(block,measure,start,tenor); if(!a) return [];
  return block.x.map((x,i)=>[x,a[i]]).filter(p=>p[1]!=null);
}
/* tenors that can START a forward (something exists beyond them), and the lengths
   available from a given start — both taken strictly from the market's own grid. */
function fwdStarts(block){
  const ts=block.tenors.map(Number).sort((a,b)=>a-b);
  return ts.filter(s=>ts.some(t=>t>s));
}
function fwdTenors(block, start){
  const s=+start, ts=block.tenors.map(Number).sort((a,b)=>a-b), have=new Set(block.tenors);
  return s<=0 ? block.tenors.slice() : ts.filter(t=>t>0&&have.has(TKEY(s+t))).map(TKEY);
}
function fwdLabel(start, tenor){ return (+start)<=0 ? tenor+'y' : start+'y'+tenor+'y'; }
function lastVal(block, measure, tenor){
  const a=block[measure][tenor]; if(!a) return null;
  for(let i=a.length-1;i>=0;i--) if(a[i]!=null) return a[i];
  return null;
}

  // forward-aware: a start is usable if something lies beyond it, and a forward length is
  // usable only if BOTH legs are reported on this market's grid (never interpolated).
  function startsFor(cc,inst){ const ts=baseTenors(cc,inst).map(Number).sort((a,b)=>a-b);
    return ts.filter(st=>ts.some(t=>t>st)); }
  function tenorsFor(cc,inst,start){ const base=baseTenors(cc,inst), st=+(start||0);
    if(st<=0) return base;
    const have=new Set(base);
    return base.map(Number).filter(t=>t>0&&have.has(TKEY(st+t))).map(TKEY); }
  function instLabel(inst){ return inst==='be'?'Breakeven':inst==='real'?'Inflation-linked':'Nominal'; }
  function fixSpec(sp){ // keep inst/start/tenor valid for the chosen market
    if(!instsFor(sp.cc).includes(sp.inst)) sp.inst='nominal';
    if(sp.start==null) sp.start='0';
    if(sp.start!=='0' && !startsFor(sp.cc,sp.inst).map(TKEY).includes(sp.start)) sp.start='0';
    const tens=tenorsFor(sp.cc,sp.inst,sp.start);
    if(!tens.includes(sp.tenor)) sp.tenor=tens.includes('10')?'10':tens[tens.length-1]; }
  function rawSeries(sp){
    const C=DATA.countries[sp.cc].instruments;
    if(sp.inst==='be'){ const n=C.nominal, r=C.real; if(!r) return null;
      const an=fwdArr(n,sp.meas,sp.start,sp.tenor)||[], ar=fwdArr(r,sp.meas,sp.start,sp.tenor)||[];
      const rm=new Map(); r.dates.forEach((d,i)=>{ if(ar[i]!=null) rm.set(d,ar[i]); });
      const out={x:[],v:[],dates:[]};
      n.dates.forEach((d,i)=>{ if(an[i]!=null && rm.has(d)){ out.dates.push(d); out.x.push(n.x[i]); out.v.push(an[i]-rm.get(d)); } });
      return out; }
    const b=C[sp.inst]; if(!b) return null; const a=fwdArr(b,sp.meas,sp.start,sp.tenor)||[];
    const out={x:[],v:[],dates:[]}; b.dates.forEach((d,i)=>{ if(a[i]!=null){ out.dates.push(d); out.x.push(b.x[i]); out.v.push(a[i]); } });
    return out; }
  function rowPts(row){
    if(row.type==='spread'){ const A=rawSeries(row.A), B=rawSeries(row.B); if(!A||!B) return [];
      const mb=new Map(); B.dates.forEach((d,i)=>mb.set(d,B.v[i]));
      const pts=[]; A.dates.forEach((d,i)=>{ if(mb.has(d)) pts.push([A.x[i], A.v[i]-mb.get(d)]); }); return pts; }
    const R=rawSeries(row.A); if(!R) return []; return R.x.map((x,i)=>[x,R.v[i]]); }
  function specLabel(sp){ const inst=sp.inst==='be'?'breakeven ':sp.inst==='real'?'real ':''; const m={obs:'yield',exp:'exp.',tp:'TP'}[sp.meas];
    return `${sp.cc} ${fwdLabel(sp.start||'0',sp.tenor)} ${inst}${m}`; }
  function rowLabel(row){ return row.type==='spread' ? specLabel(row.A)+' − '+specLabel(row.B) : specLabel(row.A); }

  // two-column layout: chart (narrower) on the left, the series builder stacked
  // vertically on the right.
  const layout=h('div',{class:'cmp-layout'});
  const left=h('div'); const right=h('div',{class:'cmp-build'});
  layout.appendChild(left); layout.appendChild(right); s.appendChild(layout);
  // left: chart card + the shared time-range slider below it
  const c=h('div',{class:'card'}); const ct=h('div',{class:'card-title'}); c.appendChild(ct);
  const cn=h('div',{class:'card-note'}); c.appendChild(cn); const lg=h('div'); c.appendChild(lg); const box=h('div'); c.appendChild(box);
  left.appendChild(c); const sliderMount=h('div',{class:'wideslider'}); left.appendChild(sliderMount);
  // right: compact, vertically-stacked series pickers + add button
  right.appendChild(h('div',{class:'cmp-build-head'},'Series'));
  const builder=h('div'); right.appendChild(builder);
  const addBtn=h('button',{class:'addrow'},'+ Add series'); addBtn.onclick=()=>{ if(CM.rows.length<5){ CM.rows.push({type:'level',A:{cc:'US',inst:'nominal',start:'0',tenor:'10',meas:'obs'}}); redraw(); } };
  const addWrap=h('div'); addWrap.style.margin='2px 0'; addWrap.appendChild(addBtn); right.appendChild(addWrap);

  function sel(opts, val, onch, labels){ const e=h('select',{class:'select-control'});
    opts.forEach(o=> e.appendChild(h('option',{value:o}, labels?labels(o):o))); e.value=val; e.onchange=()=>onch(e.value); return e; }
  function specSelects(sp, onchange){          // the four pick dropdowns, as an array
    return [
      sel(DATA.order, sp.cc, v=>{ sp.cc=v; fixSpec(sp); onchange(); }),
      sel(instsFor(sp.cc), sp.inst, v=>{ sp.inst=v; fixSpec(sp); onchange(); }, instLabel),
      sel(['0'].concat(startsFor(sp.cc,sp.inst).map(TKEY)), sp.start||'0',
          v=>{ sp.start=v; fixSpec(sp); onchange(); }, v=>v==='0'?'Spot':'in '+v+'y'),
      sel(tenorsFor(sp.cc,sp.inst,sp.start), sp.tenor, v=>{ sp.tenor=v; onchange(); }, t=>t+'y'),
      sel(['obs','exp','tp'], sp.meas, v=>{ sp.meas=v; onchange(); }, m=>({obs:'Actual',exp:'Expected',tp:'Term premium'}[m])),
    ];
  }
  function redraw(){ buildRows(); render(); addBtn.disabled=CM.rows.length>=5; }
  function buildRows(){
    builder.innerHTML='';
    CM.rows.forEach((row,i)=>{
      const r=h('div',{class:'serow'}); r.style.borderLeftColor=COL()[PAL[i]];
      const rm=h('button',{class:'rm'},'✕'); rm.title='Remove series'; rm.onclick=()=>{ if(CM.rows.length>1){ CM.rows.splice(i,1); redraw(); } };
      const selType=sel(['level','spread'], row.type, v=>{ row.type=v; if(v==='spread'&&!row.B){ row.B=JSON.parse(JSON.stringify(row.A)); } redraw(); }, t=>t==='level'?'Level':'Spread');
      // 3-per-row grid: [Level/Spread, market, instrument] then [tenor, measure]; ✕ fills the 6th cell of the last grid
      const gA=h('div',{class:'pgrid'}); gA.appendChild(selType);
      specSelects(row.A, render).forEach(e=>gA.appendChild(e));
      r.appendChild(gA);
      if(row.type==='spread'){
        r.appendChild(h('div',{class:'op'},'− minus (spread)'));
        const gB=h('div',{class:'pgrid'}); specSelects(row.B, render).forEach(e=>gB.appendChild(e));
        gB.appendChild(rm); r.appendChild(gB);
      } else { gA.appendChild(rm); }
      builder.appendChild(r);
    });
  }
  function render(){
    const anyTP=CM.rows.some(r=> r.type==='spread' || r.A.meas==='tp');
    ct.textContent='Custom comparison — '+CM.rows.length+' series';
    cn.textContent='Percent. Inflation-linked is available for the US and UK. Spreads centre on zero. Drag the handles below to zoom.';
    const series=CM.rows.map((row,i)=>({label:rowLabel(row), color:COL()[PAL[i]],
      pts: rowPts(row).filter(p=>p[0]>=CM.xlo-1e-6&&p[0]<=CM.xhi+1e-6)}));
    lg.innerHTML=''; lg.appendChild(legend(series.map(sr=>({label:sr.label,color:sr.color}))));
    box.innerHTML=''; drawLine(box,{height:360, yZero:anyTP, yFmt:v=>fmt(v,2)+'%', xFmt:xYear, xTipFmt:xFmtDay, series});
  }
  redraw();
  CHARTS.push(render);
  rangeSlider(sliderMount, refBlk.x, refBlk.dates, (lo,hi)=>{ CM.xlo=lo; CM.xhi=hi; render(); });
})();

/* ------------------------------------------------ 3a. REGIMES — why sample choice is the estimate */
(function(){
  const INFO='<b>The short version.</b> A term premium is a yield minus a forecast of the average future short rate. The forecast comes from the estimated persistence of the short rate — how fast it reverts, and to what level. Those two parameters are the least well identified things in the model, and what you get for them depends almost entirely on <i>which years you estimate on</i>. So the sample is not a housekeeping detail; on a yields-only model it is close to being the estimate.';
  const s=panel('regimes','Historical lens','Why a longer sample is not a better estimate',
    ['The instinct with a weakly identified parameter is to feed it more data. For term premia that instinct is wrong, and the Federal Reserve has published the demonstration. Li, Meldrum and Rodriguez (<a href="https://www.federalreserve.gov/econres/notes/feds-notes/robs-of-long-maturity-term-premium-estimates-20170403.html" target="_blank" rel="noopener">FEDS Notes, April 2017</a>) take the two official US decompositions — <b>Kim–Wright</b> and <b>Adrian–Crump–Moench</b> — which look almost identical on paper and yet disagree materially on the 10-year premium, and work out why. It is not the estimation technique, nor the exact choice of yields and factors: those "appear to be much less important". It is the information used to pin down expectations. KW feed the model <b>Blue Chip survey forecasts</b>; ACM use yields alone. Once you add surveys to ACM, it becomes KW.',
     'The mechanism is worth stating precisely, because it is the same one at work in every market here. Yields are <b>extremely persistent</b>, so a sample of any realistic length carries very little information about the long-run level rates revert to, or the speed of reversion. Worse, the point estimate of persistence is <b>biased downward in short samples</b> — the model thinks rates mean-revert faster than they do, which makes the expected-rate path too flat and dumps the difference into the premium. The Fed note shows the consequence directly: the same yields-only model estimated from 1961 and from 1990 gives materially different 10-year premia.',
     'That leaves a genuine dilemma rather than a free lunch, and the note is explicit about both horns. Drop the pre-1990 data and structural breaks can no longer bias the parameters — but yields then fall almost monotonically through what remains, so there is "almost no information" left with which to estimate a long-run mean at all. Keep the long sample and you have more variation, but you are now fitting one set of parameters across the Great Inflation, the Volcker disinflation, and the zero-bound era as though they were one world. That is what produces the result the FT called implausible: because 1970s yields sat far above the <i>full-sample</i> average, a long-sample model concludes that investors in 1979 expected rates to fall.']);
  const hh=s.querySelector('h2'); if(hh) hh.appendChild(infodot(INFO));

  const p4=h('p',{html:'<b>Our answer is to choose the sample by regime rather than by length.</b> Surveys are the fix the Fed note lands on, and they work — but they exist for the US, patchily for the UK, and barely elsewhere, so building on them would cost the cross-market comparability that is the point of this atlas. Instead each market’s parameters are estimated on a single monetary-policy regime, so there is no break inside the sample to average across. Three things then do the work surveys would have done: the sample is <b>regime-clean</b> (no structural break to bias the persistence); the persistence is <b>bias-corrected</b> (Bauer–Rudebusch–Wu bootstrap, which is the other non-survey remedy the note names, and which lifted our short-end agreement with the SF Fed series from 0.14 to 0.83 at 1y); and a <b>~3.5-year mean-reversion floor</b> stops the expected-rate path collapsing onto today’s policy rate. Everything before the regime start is still shown — but as observed yields with <b>extrapolated</b> parameters, flagged as such, and cross-checked against a separate regime-switching model rather than quietly folded into the estimate.'});
  s.querySelector('.panel-head').appendChild(p4);

  const c=h('div',{class:'card'});
  c.appendChild(h('div',{class:'card-title'},'The estimation regime, market by market'));
  c.appendChild(h('div',{class:'card-note'},'Parameters are fit only from the "regime starts" date. Earlier years are decomposed with extrapolated parameters and shaded in the Explorer.'));
  const tw=h('div',{class:'twrap'}); const tb=h('table');
  tb.appendChild(h('thead',null,[h('th',null,'Market'),h('th',null,'Regime starts'),
    h('th',null,'Data from'),h('th',{class:'tprose'},'How that date was chosen')].reduce((tr,x)=>{tr.appendChild(x);return tr;}, h('tr'))));
  const rows=[
    ['United States','Jan 1987','1961','The post-Volcker disinflation — and a 2-regime Kim filter on the full 1961+ curve <b>confirms</b> it: the high-volatility regime is confined to 1973–75 and 1979–82 (mean probability <b>0.98</b> across Oct-1979 to Oct-1982), and everything post-1985 is clean.'],
    ['Japan','May 2000','1974','<b>Dated by the model</b>, which moved it. A 2-regime Kim filter on 1974+ puts a permanent level break at <b>2000-05-31</b>, the ZIRP-to-deflation transition. The previous start — 1986, the first published 10y JGB — sat 14 years <i>inside</i> the old regime.'],
    ['Germany','Jan 1984','1972 (1997 daily)','<b>Dated by the model</b>, which moved it back 15 years. The permanent level break is <b>1983-11</b> (anchor 11.9% → 2.5%, one switch in 647 months, P(high regime) = 0.000 every year since). Monetary union is invisible to the rate regime, so the old 1999 start was clean but discarded 180 months of same-regime data.'],
    ['United Kingdom','Nov 1995','1979','<b>Dated by the model</b>, which moved it forward 3 years. The last sustained spell in the high-anchor regime (14.2%) runs to <b>1995-10</b>: the curve re-anchored three years <i>after</i> inflation targeting was announced in Oct 1992, so the old start sat 37 months inside the old regime. Announcement is not re-anchoring — independence followed in 1997.'],
    ['Canada','1991','1986','Inflation targeting, adopted February 1991. <b>The model cannot test this one:</b> the BoC curve starts in 1986, leaving ~60 months before the policy change, and the filter finds only a recurring volatility state (12 switches, and an unidentified anchor of 31%). Neither confirmed nor refuted.'],
    ['Switzerland','1988','1988','The SNB curve itself begins here, so there is no earlier regime to exclude — the one market where the start is a data limit rather than a choice.'],
  ];
  const body=h('tbody');
  rows.forEach(r=>body.appendChild(h('tr',null,[h('td',null,r[0]),h('td',null,r[1]),h('td',null,r[2]),h('td',{class:'tprose',html:r[3]})])));
  tb.appendChild(body); tw.appendChild(tb); c.appendChild(tw); s.appendChild(c);

  const honest=h('div',{class:'callout'});
  honest.innerHTML='<b>Which of these are model-dated.</b> Four of the six starts have now been tested with a fitted regime-switching model, and <b>three of the four moved</b> — Japan back 14 years, Germany back 15, the UK forward 3. Only the US start survived the test unchanged. Canada cannot be tested at all: its curve begins only five years before the policy change under test, which is not enough history to identify a permanent level shift, so its start still rests on the policy record. Switzerland’s start is a data limit, not a choice. The lesson we would draw is that the institutional calendar is a poor guide to when a <i>curve</i> re-anchors — it was wrong, in both directions, everywhere we could check it.';
  s.appendChild(honest);

  const meas=h('div',{class:'callout orange'});
  meas.innerHTML='<b>What the sample choice is worth, measured.</b> Japan is the clean natural experiment, because only the start date changed. On the old <b>1986</b> start — 14 years of which sat inside the pre-2000 high-level regime — the latest 10-year premium came out at <b>+0.89%</b>. Re-estimated on the regime-clean <b>2000+</b> sample, the same model on the same data gives <b>+2.15%</b>: a <b>126 bp</b> move in the headline number from a sample boundary alone, with no change to the pricing model, the estimator, or the yields. The direction is the one the theory predicts — a regime-clean sample has a lower anchor, so the expected-rate path sits lower and more of the yield is left as premium. Germany and the UK move for the same reason and in opposite directions: Germany gains 180 months of a <i>high</i>-premium era (the discarded 1984–98 window averaged <b>+2.27%</b> against <b>+1.01%</b> for 1999+), which lifts its anchor; the UK sheds 37 months that averaged <b>+1.38%</b> against <b>+0.46%</b> for 1996+, which lowers its. The two cross-check panels below show the same phenomenon visually for the US Great Inflation and for Japan before deflation — the single-regime model extrapolated backwards against a 2-regime model that gives each era its own mean reversion. Both agree on <b>shape and sign</b> in the deep past; they disagree on <b>level</b>, and that gap is exactly the anchoring uncertainty this section is about.';
  s.appendChild(meas);

  const jp=h('div',{class:'callout teal'});
  jp.innerHTML='<b>And Japan may already have left the regime we estimate it on.</b> The discipline above has an uncomfortable corollary: a regime-clean sample is only clean until the regime changes. A separate 2-regime filter fit on Japan’s <i>modern</i> sample alone splits it into a deep deflation world (long-run anchor <b>−0.31%</b>) and a higher-rate world (<b>+4.38%</b>) — and on the real-time estimate the probability Japan is in the higher-rate world has been pinned at <b>1.00 since late 2016</b>, well before the BoJ’s 2024 exit from negative rates and yield-curve control. So the 2000+ sample now straddles a break of its own. <b>What we do about it:</b> we publish the probability as a live tripwire (the <a href="#jpregime">regime monitor</a> below); we re-anchor Japan’s expected-rate path at decomposition time with a survey-based <b>shifting endpoint</b>, which updates the destination of the path without re-estimating anything; and we label the current Japanese level as anchor-sensitive, so read <b>changes</b> rather than the absolute level. <b>What we deliberately do not do</b> is re-cut the sample to 2016+. Ten years of a market that spent most of them at the bound cannot identify persistence — that is the Fed note’s second horn, and cutting again would trade a known bias for a much larger variance.';
  s.appendChild(jp);
})();

(function(){
  const b=DATA.countries.JP && DATA.countries.JP.instruments.nominal;
  const R=b && b.regime_monitor; if(!R || !R.x || !R.x.length) return;
  const lo=(R.theta_lo!=null?R.theta_lo+'%':'low'), hiθ=(R.theta_hi!=null?R.theta_hi+'%':'higher');
  const INFO='<b>What this is.</b> A separate 2-regime Markov-switching term-structure model, fit <b>only on Japan’s modern sample (2000+)</b>. It distinguishes a <b>deep deflation/ZIRP regime</b> (the curve anchored near zero; long-run level θ≈'+lo+') from a <b>higher-rate regime</b> (θ≈'+hiθ+', a mean-reversion <i>attractor</i> — not a literal rate forecast). The line is the model’s probability — <b>given data up to each date</b> — that Japan is in the higher-rate regime. <b>Real-time (filtered)</b> uses only information available at the time, so it never rewrites history as new data arrive; <b>full-sample (smoothed)</b> uses the whole history, cleaner but revising. <b>Why it matters.</b> The regime sets where the term premium mean-reverts (its θ anchor), so a change is an early signal that the modern-sample premium itself may need to re-anchor — the same θ-anchoring caveat behind today’s Japan premium level.';
  const s=panel('jpregime','Regime monitor','Japan — deep-deflation or higher-rate regime?',
    ['A real-time gauge from a 2-regime model fit only on Japan’s modern sample (2000+): is the JGB curve anchored in the <b>deep deflation/ZIRP</b> regime, or the <b>higher-rate</b> regime it mean-reverts to a positive level in? Toggle the <b>real-time (filtered)</b> probability — the honest live signal, using only past data — against the <b>full-sample (smoothed)</b> estimate.']);
  const hh=s.querySelector('h2'); if(hh) hh.appendChild(infodot(INFO));
  const st={view:'filtered'};
  const bar=h('div',{class:'ctrlbar'});
  const g=h('div',{class:'grp'}); g.appendChild(h('span',{class:'eyebrow'},'Estimate'));
  const seg=h('div',{class:'seg'});
  [['filtered','Real-time (filtered)'],['smoothed','Full-sample (smoothed)']].forEach(([v,lab])=>{
    const bt=h('button',null,lab); if(v===st.view)bt.classList.add('active');
    bt.onclick=()=>{ st.view=v; [...seg.children].forEach(x=>x.classList.toggle('active',x===bt)); render(); };
    seg.appendChild(bt); });
  g.appendChild(seg); bar.appendChild(g); s.appendChild(bar);
  const c=h('div',{class:'card'});
  c.appendChild(h('div',{class:'card-title'},'Probability Japan is in the higher-rate regime (vs deep deflation / ZIRP)'));
  c.appendChild(h('div',{class:'card-note'},'2-regime Kim filter on the 2000+ JGB curve. The dashed vertical marks the BoJ’s March-2024 exit from negative rates and yield-curve control.'));
  const box=h('div'); c.appendChild(box);
  const call=h('div',{class:'callout teal'}); c.appendChild(call);
  s.appendChild(c);
  const X=R.x, half=X.map(()=>0.5), zero=X.map(()=>0);
  function callout(P){
    const n=P.length, last=P[n-1], v2=P[Math.max(0,n-25)];
    const pc=v=>Math.round(v*100)+'%', dt=R.dates[n-1];
    // entry into the current above-50% run
    let j=-1; for(let i=n-1;i>=0;i--){ if(P[i]<0.5){ j=i; break; } }
    const entryYr=Math.floor((j>=0 && j+1<n) ? X[j+1] : X[0]);
    let lead;
    if(last>=0.5) lead='On the '+st.view+' estimate Japan has been in the <b>higher-rate regime since ~'+entryYr+'</b> (probability now <b>'+pc(last)+'</b>, as of '+dt+'). The break from deep deflation therefore <b>predates the headlines</b>: the BoJ’s 2024 exit from negative rates and YCC falls <b>within</b> an already-established regime rather than at a fresh break. The deepest-deflation regime the model isolates is <b>2009–2016</b> (the QQE/NIRP trough); Japan sat in the higher-rate regime early on too (2000–2008).';
    else if((last-v2)>=0.15) lead='As of <b>'+dt+'</b>, the '+st.view+' probability of the higher-rate regime has climbed from <b>'+pc(v2)+'</b> two years ago to <b>'+pc(last)+'</b> — an <b>early, still-tentative</b> sign the deflation regime is breaking.';
    else lead='As of <b>'+dt+'</b>, the '+st.view+' probability of the higher-rate regime is <b>'+pc(last)+'</b>: the filter still reads Japan as anchored in the deep deflation/ZIRP regime.';
    return lead+' <span style="opacity:.85">This linear regime filter abstracts from the effective lower bound and is fit on ~25 years, so read it as a <b>directional diagnostic</b> — a companion to the premium, not a calibrated forecast.</span>';
  }
  function render(){
    const CC=COL(), P=(st.view==='filtered'?R.p_filtered:R.p_smoothed);

    drawStacked(box,{height:250, x:X, yFmt:v=>Math.round(v*100)+'%', xFmt:xYear, xTipFmt:xFmtDay,

      lines:[{y:half, color:CC.faint, width:1, dash:'4 3', label:'50%'}],
      line:{y:P, color:CC.teal, width:2.2, label:'P(higher-rate regime)'}});
    call.innerHTML=callout(P);
  }

})();

  return;   // HIDDEN from the front-end for now (data pipeline retained; non-binding issues to resolve)
  const de=DATA.countries.DE; const nz=de&&de.bund_noise; if(!nz) return;
  panel('liquidityde','Market quality','German Bund liquidity — curve-fitting “noise”',
    ['The same Hu–Pan–Wang “noise” gauge applied to the German Bund cross-section: per day, fit a smooth curve to the yields of every outstanding Bund/Bobl/Schatz (Bundesbank per-security reference prices) and take the <b>RMS deviation</b>. Low when the market is liquid and every issue sits on the curve; higher when individual bonds scatter. A free daily illiquidity read on the euro-area benchmark, built only from public security-level data — the DE analogue of the US TIPS gauge above.']);
  const s=M.lastChild;
  const c=h('div',{class:'card'});
  c.appendChild(h('div',{class:'card-title'},'German Bund cross-sectional fitting noise'));
  c.appendChild(h('div',{class:'card-note'},'Basis points, daily. Higher = individual Bunds priced further from a smooth curve (less liquid). History is short (Bundesbank publishes only recent months) and lengthens daily. Drag the handles below to zoom.'));
  const box=h('div'); c.appendChild(box);
  const sliderMount=h('div'); c.appendChild(sliderMount); s.appendChild(c);
  const allPts=nz.x.map((x,i)=>[x,nz.noise[i]]).filter(p=>p[1]!=null);
  const NZ={xlo:nz.x[0], xhi:nz.x[nz.x.length-1]};
  function render(){
    const CC=COL();
    box.innerHTML=''; drawLine(box,{height:260,yZero:true,yFmt:v=>fmt(v,0)+' bp',xFmt:xYear,xTipFmt:xFmtDay,
      series:[{label:'Bund noise',color:CC.purple,pts:allPts.filter(p=>p[0]>=NZ.xlo-1e-6&&p[0]<=NZ.xhi+1e-6)}]});
  }
  render(); CHARTS.push(render);
  rangeSlider(sliderMount, nz.x, nz.dates, (lo,hi)=>{ NZ.xlo=lo; NZ.xhi=hi; render(); });
  // JS-computed callout: latest, mean, and the peak with its date.
  const call=h('div',{class:'callout'});
  const vals=allPts.map(p=>p[1]);
  if(vals.length){
    const latest=vals[vals.length-1];
    const mean=vals.reduce((a,b)=>a+b,0)/vals.length;
    let pk=allPts[0]; allPts.forEach(p=>{ if(p[1]>pk[1]) pk=p; });
    const pkDate=nz.dates[nz.x.indexOf(pk[0])]||'';
    const pkYM=pkDate?pkDate.slice(0,7):'';
    call.innerHTML='Bund noise averages <b>'+fmt(mean,1)+' bp</b> over the sample, peaking at <b>'+fmt(pk[1],1)+' bp</b> ('+pkYM+') and sitting near <b>'+fmt(latest,1)+' bp</b> today. Bunds are among the most liquid government bonds in the world, so the level stays low; spikes flag genuine market stress independent of any term-premium model.';
  } else {
    call.innerHTML='The gauge is independent of any term-premium model, so it doubles as a data-quality check on the Bund curve.';
  }
  s.appendChild(call);
})();

/* ------------------------------------------------ 3g. GLOBAL CYCLE (measure x curve point) */
(function(){
  const gf=DATA.global_factor; if(!gf || !gf.combos) return;
  const KEY=(m,p)=>m+'@'+p;
  const MLAB=gf.measure_labels||{observed:'Actual yield',expected:'Expected rate',term_premium:'Term premium'};
  const PT=p=>/y\d/.test(p)? p.replace(/^(\d+)y(\d+)y$/,'$1y$2y fwd') : p;
  let def=(gf.default||'').split('@');
  const GF={mkt:'US', measure:def[0]||'term_premium', point:def[1]||'10y', xlo:null, xhi:null};
  const cur=()=>gf.combos[KEY(GF.measure,GF.point)];
  if(!cur()){ const k=Object.keys(gf.combos)[0].split('@'); GF.measure=k[0]; GF.point=k[1]; }

  panel('globalfactor','Global cycle','Each market versus the global cycle',
    ['Across five major markets (US, Germany, Japan, the UK and Canada — Switzerland is left out, its bond market too thin to belong in a common cycle) yields move largely <b>together</b>. We extract the <b>common factor</b> and split each market into that <b>global cycle</b> plus a <b>local residual</b> — how cheap or rich it sits versus the cycle. Choose which part of the curve to look at and which component: the cycle is far stronger in <b>yields</b> and <b>term premia</b> than in <b>expected rates</b>, which stay comparatively domestic. Both charts share the time slider (month-end).']);
  const s=M.lastChild;
  const bar=h('div',{class:'ctrlbar'});
  function seg(labelTxt, items, get, set){
    const g=h('div',{class:'grp'}); g.appendChild(h('span',{class:'eyebrow'},labelTxt));
    const sg=h('div',{class:'seg'});
    items.forEach(it=>{ const b=h('button',null,it.label); if(it.val===get())b.classList.add('active');
      b.onclick=()=>{ set(it.val); [...sg.children].forEach(x=>x.classList.toggle('active',x===b)); onCombo(); };
      b.dataset.val=it.val; sg.appendChild(b); });
    g.appendChild(sg); bar.appendChild(g); return sg;
  }
  const segM=seg('Component', (gf.measures||['term_premium']).map(m=>({val:m,label:MLAB[m]||m})),
                 ()=>GF.measure, v=>GF.measure=v);
  const segP=seg('Curve point', (gf.points||['10y']).map(p=>({val:p,label:PT(p)})),
                 ()=>GF.point, v=>GF.point=v);
  const gMk=h('div',{class:'grp'}); gMk.appendChild(h('span',{class:'eyebrow'},'Market'));
  const segK=h('div',{class:'seg'}); gMk.appendChild(segK); bar.appendChild(gMk);
  s.appendChild(bar);

  const dual=h('div',{class:'dual'});
  const cB=h('div',{class:'card'}); const ctB=h('div',{class:'card-title'}); const cnB=h('div',{class:'card-note eqnote'});
  cB.appendChild(ctB); cB.appendChild(cnB); const lgB=h('div'); cB.appendChild(lgB); const boxB=h('div'); cB.appendChild(boxB);
  const cR=h('div',{class:'card'}); const ctR=h('div',{class:'card-title'}); const cnR=h('div',{class:'card-note eqnote'});
  cR.appendChild(ctR); cR.appendChild(cnR); const lgR=h('div'); cR.appendChild(lgR); const boxR=h('div'); cR.appendChild(boxR);
  dual.appendChild(cB); dual.appendChild(cR); s.appendChild(dual);
  const sliderMount=h('div',{class:'wideslider'}); s.appendChild(sliderMount);
  const shareNote=h('div',{class:'callout'}); s.appendChild(shareNote);
  s.appendChild(h('div',{class:'callout',html:'<b>The local residual is a relative-value signal.</b> A market trading <b>cheap</b> versus the global cycle (observed above the fitted line — a positive residual) has tended to <b>outperform</b> the others over the next month — in the research backtest the residual carries relative-value information beyond a naive term-spread carry signal. A construct-validity diagnostic on synthetic duration-hedged excess returns across the five markets — not a tradeable strategy (no costs, no real hedging). See <i>FINDINGS_global_factor</i>.'}));

  function rebuildMarkets(){
    const c=cur(); segK.innerHTML='';
    if(!c.order.includes(GF.mkt)) GF.mkt=c.order[0];
    c.order.forEach(cc=>{ const b=h('button',null,cc); if(cc===GF.mkt)b.classList.add('active');
      b.onclick=()=>{ GF.mkt=cc; [...segK.children].forEach(x=>x.classList.toggle('active',x===b)); render(); };
      segK.appendChild(b); });
  }
  function onCombo(){
    const c=cur();
    if(!c){ return; }
    rebuildMarkets();
    GF.xlo=c.x[0]; GF.xhi=c.x[c.x.length-1];
    sliderMount.innerHTML='';
    rangeSlider(sliderMount, c.x, c.dates, (lo,hi)=>{ GF.xlo=lo; GF.xhi=hi; render(); });
    render();
  }
  function render(){
    const c=cur(); if(!c) return;
    const CC=COL(), inWin=p=>p[0]>=GF.xlo-1e-6&&p[0]<=GF.xhi+1e-6;
    const m=c.markets[GF.mkt]; if(!m) return;
    const mcol=CC[CCOL[GF.mkt]]||CC.blue;
    let x0=c.x[c.x.length-1];
    for(let i=0;i<m.observed.length;i++){ if(m.observed[i]!=null){ x0=c.x[i]; break; } }
    const obs=c.x.map((x,i)=>[x,m.observed[i]]).filter(p=>p[1]!=null&&inWin(p));
    const fit=c.x.map((x,i)=>[x,m.fitted[i]]).filter(p=>p[1]!=null&&inWin(p)&&p[0]>=x0-1e-6);
    const resid=c.x.map((x,i)=>[x,(m.observed[i]!=null&&m.fitted[i]!=null)?m.observed[i]-m.fitted[i]:null])
                   .filter(p=>p[1]!=null&&inWin(p)&&p[0]>=x0-1e-6);
    const lab=(MLAB[c.measure]||c.measure).toLowerCase(), pt=PT(c.point);
    ctB.textContent=`${DATA.countries[GF.mkt].name} — ${pt} ${lab} vs the global cycle`;
    cnB.textContent='Percent, month-end. Observed against the global-cycle-implied fitted (α+β·G). Drag the handles below to zoom.';
    lgB.innerHTML=''; lgB.appendChild(legend([{label:'Observed '+pt+' '+lab,color:mcol},
      {label:'Global-cycle fitted (α+β·G)',color:CC.faint,dash:true}]));
    boxB.innerHTML=''; drawLine(boxB,{height:300,yZero:true,yFmt:v=>fmt(v,2)+'%',xFmt:xYear,xTipFmt:xFmtDay,
      series:[{label:'Observed',color:mcol,width:2.2,pts:obs},
              {label:'Fitted',color:CC.faint,dash:'5 4',pts:fit}]});
    ctR.textContent=`${DATA.countries[GF.mkt].name} — local residual (observed − fitted)`;
    cnR.textContent='Percent, month-end. The gap between the two lines on the left: positive = cheap versus the global cycle, negative = rich. Same time window.';
    lgR.innerHTML=''; lgR.appendChild(legend([{label:'Local residual (obs − fitted)',color:mcol}]));
    boxR.innerHTML=''; drawLine(boxR,{height:300,yZero:true,yFmt:v=>fmt(v,2)+'%',xFmt:xYear,xTipFmt:xFmtDay,
      series:[{label:'Residual',color:mcol,width:2,pts:resid}]});
    const pc=(c.pca_ladder&&c.pca_ladder[0])||0, sh=(m.share!=null?m.share:0);
    const miss=(c.order.length<((gf.combos[KEY(c.measure,'10y')]||{order:c.order}).order.length))
      ? ' <b>The UK is absent at 30y</b> — the BoE curve we ingest stops at 20y, so this is a four-market cycle; 20y is the like-for-like long point.' : '';
    shareNote.innerHTML='At <b>'+pt+'</b>, one common factor explains <b>'+pc.toFixed(0)+'%</b> of the cross-market variation in the <b>'+lab+
      '</b>, and <b>'+sh.toFixed(0)+'%</b> of '+DATA.countries[GF.mkt].name+'’s own variation (balanced panel from '+(c.balanced_start||'—')+
      ').'+miss+' Comparing components at the same point is the interesting bit: the cycle is strongest in yields, weaker in expected rates — distant policy expectations are the most <i>local</i> thing on the curve.';
  }
  onCombo(); CHARTS.push(render);
})();

/* ------------------------------------------------ 4. DATA / METHOD */
(function(){
  panel('data','The data','Method',
    ['Each curve is fitted with a single arbitrage-free Nelson–Siegel model extended with the Christensen–Rudebusch <b>shadow rate</b>, estimated by extended-Kalman QML on a modern <b>regime-clean</b> sample — the two choices that separate this from the published affine decompositions. The sample choice is argued out under <a href="#regimes">Historical lens</a>; the lower bound is below. The expected-rate path is anchored by a calibrated <b>~3.5-year mean-reversion floor</b> on the physical persistence. The term premium shown is the <b>realised</b> premium: the observed yield minus the model’s expected average future short rate. Real curves (US TIPS, UK index-linked) have no lower bound and reduce to plain AFNS.']);
  const s=M.lastChild;
  // summary table
  const c=h('div',{class:'card'});
  c.appendChild(h('div',{class:'card-title'},'Coverage & latest 10-year term premium'));
  const tw=h('div',{class:'twrap'}); const tb=h('table');
  tb.appendChild(h('thead',null,h('tr',null,['Market','Instrument','Sample','ELB','10y TP','10y yield'].map(x=>h('th',null,x)))));
  const body=h('tbody');
  DATA.order.forEach(cc=>{ Object.entries(DATA.countries[cc].instruments).forEach(([k,b])=>{
    const tp=lastVal(b,'tp','10'), y=lastVal(b,'obs','10');
    const tr=h('tr',null,[
      h('td',null,DATA.countries[cc].name),
      h('td',null,k==='real'?'Inflation-linked':'Nominal'),
      h('td',null,b.sample),
      h('td',null,b.elb==null?'—':fmt(b.elb,2)+'%'),
      h('td',{class:tp==null?'':(tp>=0?'sign-pos':'sign-neg')}, tp==null?'—':fmtSigned(tp,2)),
      h('td',null,y==null?'—':fmt(y,2))]);
    body.appendChild(tr);
  }); });
  tb.appendChild(body); tw.appendChild(tb); c.appendChild(tw); s.appendChild(c);
  // ---- the shadow rate + the estimated lower bound (the extension not in the published series)
  const sr=h('div',{class:'card'});
  sr.appendChild(h('div',{class:'card-title'},'The shadow rate — and why the lower bound is estimated, not assumed'));
  sr.appendChild(h('div',{class:'card-note'},'The one structural extension here that none of the published, freely available term-premium series carries.'));
  const srp=h('div',{class:'prose'});
  srp.innerHTML='<p>Every widely published decomposition — Kim–Wright, Adrian–Crump–Moench, and the SF Fed series this atlas validates against — is a <b>Gaussian affine</b> model. Interest rates in it are normally distributed, so nothing stops the model projecting the short rate to −2% or −4%. The Fed’s own note says so plainly and draws the conclusion: these models "do not impose a lower bound on nominal interest rates", shadow-rate models "are likely to be more appropriate for analyzing term premiums at short maturities during recent years", and so the note <b>restricts itself to the 10-year horizon</b>, which is least affected. That is a reasonable defence for a US-only study of the long end. It is not available to an atlas that publishes the 3-month to 30-year curve for six markets, three of which spent years with policy rates <i>below zero</i>.</p>'
    + '<p>So every nominal curve here is fitted with the <b>Christensen–Rudebusch shadow-rate</b> extension. A latent shadow short rate is free to go as negative as the data imply; the rate that actually prices bonds is the shadow rate <b>floored at the effective lower bound</b>. Because the floor is an option payoff, forward rates follow the Krippner closed form, and yields integrate those forwards — which makes the measurement equation <b>non-linear</b>, so the model is estimated by extended-Kalman QML rather than the linear regressions the published series use. The property that matters in practice: away from the bound the option is worthless and the model <b>collapses exactly onto plain AFNS</b>. It costs nothing in normal times and only binds when it should.</p>'
    + '<p><b>The lower bound is a parameter, not an input.</b> This is the part that is easy to get wrong. It is tempting to set the ELB to the policy rate and move on — but the bound that matters is not a policy rate, it is the cost of holding institutional cash instead, and nobody observes it. Because the floor enters through a smooth option formula, the likelihood is differentiable in the bound, so we simply <b>add it to the parameter vector and let maximum likelihood find it</b>, then profile the likelihood around the optimum to see how well it is actually identified. That last step is the honest part, because the answer differs sharply by market.</p>';
  sr.appendChild(srp);
  const etw=h('div',{class:'twrap'}); const etb=h('table');
  etb.appendChild(h('thead',null,[h('th',null,'Market'),h('th',null,'Bound used'),h('th',null,'Source'),
    h('th',{class:'tprose'},'How well the data identify it')].reduce((tr,x)=>{tr.appendChild(x);return tr;}, h('tr'))));
  const ebody=h('tbody');
  [['Germany','−0.78%','ML estimate','<b>Well identified.</b> Bund yields went clearly negative. The likelihood profile has a shallow optimum across −0.75% to −1.0% and deteriorates sharply above −0.5% (it collapses entirely at 0%). Praet’s −1.0% reversal-rate figure sits within ~6 log-likelihood of the optimum — the data confirm it rather than assume it.'],
   ['Japan','−0.20%','ML estimate','<b>Well identified.</b> JGB yields sat at the bound for years. The estimate lands at −0.20%, essentially the BoJ’s −0.10% NIRP policy rate, and inside the revealed short-yield floor — not at the deeper −0.75% reversal-rate concept.'],
   ['Canada','+0.18%','ML estimate','<b>Weakly identified.</b> Canada only grazed the bound, so the estimate pins to the observed short-yield floor rather than to anything structural.'],
   ['United States','−0.35%','Calibrated, ML-checked','<b>Identified from above only.</b> ML on US data returns <b>+0.16%</b>: the likelihood sharply rules out any bound above ~+0.2% — a floor cannot sit above the lowest observed yield — but is nearly flat going more negative (only ~180 log-likelihood from 0% to −2%). US yields never went negative, so there is no information about how far below zero the bound sits. We therefore keep a calibrated −0.35% with a sensitivity band, and this is also why the US shadow rate is shallow.'],
   ['United Kingdom','−0.35%','Calibrated','<b>Weakly identified.</b> The mildest lower bound of the six: Bank Rate floored at 0.10% and short gilt yields barely went negative. Fixed rather than estimated; the shadow machinery hardly binds.'],
   ['Switzerland','−0.75%','Calibrated','Set at the revealed SNB floor — the deepest actually observed policy rate anywhere in the atlas.'],
   ['US TIPS · UK index-linked','none','—','Real rates have no lower bound — there is no such thing as real cash — so for the inflation-linked curves the bound is pushed out of reach and the model reduces to plain AFNS by construction.'],
  ].forEach(r=>ebody.appendChild(h('tr',null,[h('td',null,r[0]),h('td',null,r[1]),h('td',null,r[2]),h('td',{class:'tprose',html:r[3]})])));
  etb.appendChild(ebody); etw.appendChild(etb); sr.appendChild(etw);
  const srn=h('div',{class:'callout teal'});
  srn.innerHTML='<b>Does the mechanism behave?</b> The internal check is the German shadow rate: through the ECB’s negative-rate era it falls to <b>−1.17% (Dec 2016)</b> — <i>below</i> the fitted bound, which is correct, since the shadow rate is unbounded and it is the <i>observed</i> rate the floor applies to — and averages about −0.53% over 2019–21 against an actual 3-month Bund yield of −0.67%. Away from the bound it converges back onto the plain-AFNS fit. <b>Why it matters for the premium:</b> without a floor, the expected-average-short-rate leg of the decomposition would project deeply negative rates through the ZIRP years, and every basis point of that impossible path would be booked as term premium instead.';
  sr.appendChild(srn);
  s.appendChild(sr);

  // interpretation caveat
  const cav=h('div',{class:'callout orange'});
  cav.innerHTML='<b>Anchoring the expected-rate path.</b> A yields-only model tends to a near-unit-root, so the expected-average short rate would track <b>today’s</b> policy rate and the term premium would degenerate into the term spread (collapsing to deeply negative in the 2022–23 hiking cycle). We instead impose a calibrated <b>~3.5-year mean-reversion</b> so the expected path reverts to its long-run mean — calibrated on the US against the <b>SF Fed Christensen–Rudebusch</b> series (10y correlation 0.80, identical latest value 1.19%) and applied uniformly to every market. One residual caveat: a yields-only model still cannot see central-bank bond purchases, so it does not separately identify QE’s compression of the premium.';
  s.appendChild(cav);
  // historical-extension caveat
  const cav2=h('div',{class:'callout orange'});
  cav2.innerHTML='<b>The extended history (pre-estimation-sample).</b> Observed yields run to each daily source’s start (US 1961, UK 1979, Japan 1974), but the model <b>parameters</b> are fit on each market’s modern sample (US 1987+, Germany 1984+, UK 1995+, Japan 2000+, …). Before that boundary — shaded orange in the Explorer — the decomposition applies <b>extrapolated</b> parameters. The mean-reversion floor keeps this well-behaved even at 1970s–80s rate levels (no blow-up), and a separate 2-regime model agrees closely there (see the Great-Inflation section — correlation 0.91). The shared caveat is subtler: both anchor the expected-rate path to a <b>low modern-era long-run mean</b>, so if the 1970s market expected persistently higher rates, both <b>overstate</b> the premium — read the deep-past level as “high and positive”, and rely on event-window <b>changes</b> (which difference the bias out) more than the absolute level.';
  s.appendChild(cav2);
  // NOTE: the "Download CSV" card was removed while the Atlas is being shared with
  // colleagues mid-build — the numbers are still moving, and a downloaded snapshot
  // would be detached from the daily rebuild and impossible to tell apart from a
  // current one. Restore this block (and the downloadCsv helper above) to bring it
  // back; the canonical long-form data remains in viz/data_daily.parquet and in the
  // Supabase term_premia table.
})();

// theme + resize redraw (required)
window.addEventListener('themechange',()=>{ CHARTS.forEach(fn=>fn()); });
window.addEventListener('resize',()=>{ clearTimeout(window._rz); window._rz=setTimeout(()=>CHARTS.forEach(fn=>fn()),150); });
</script>
