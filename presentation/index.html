<style>
/* Light throughout, matching the scenario sheet's own ground. Committed single

:root{
  --bg:#F4F1EC; --stage:#FBFAF8; --card:#FFFFFF; --sunk:#F4F1EC;

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
#frame{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1280px;height:720px;background:var(--stage);position:relative;

.slide{position:absolute;inset:0;padding:44px 66px 58px;display:flex;flex-direction:column}
.kicker{font:500 12px/1 var(--mono);letter-spacing:.17em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--serif);font-weight:500;font-size:52px;line-height:1.06;margin:16px 0 0;
  letter-spacing:-.015em;text-wrap:balance}
h2{font-family:var(--serif);font-weight:500;font-size:33px;line-height:1.12;margin:9px 0 0;
  letter-spacing:-.008em;text-wrap:balance}
.take{font:400 16px/1.5 var(--sans);color:var(--ink2);max-width:82ch;margin:9px 0 0}
.take b{color:var(--ink);font-weight:600}
.take .hi{color:var(--accent);font-weight:600}
.chartwrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;gap:34px}
svg{display:block;overflow:visible}
svg text{font-family:var(--mono);fill:var(--muted);font-size:11.5px}
svg .lbl{font-size:12.5px;font-weight:600}
.gridline{stroke:var(--rule-soft);stroke-width:1}
.zeroline{stroke:var(--rule);stroke-width:1.25}
path.series{fill:none;stroke-width:2.1;stroke-linejoin:round;stroke-linecap:round}
path.thin{stroke-width:1.4}
.reveal{opacity:0;transform:translateY(9px);transition:opacity .55s ease,transform .55s ease}
.reveal.on{opacity:1;transform:none}
.dimmable{transition:opacity .55s ease}
.halfdim{opacity:.42}
.bignum{font:600 66px/1 var(--mono);letter-spacing:-.025em}
.stat{text-align:center}
.stat .cap{font:500 11px/1.4 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.stat .sub{font:400 13px/1.45 var(--sans);color:var(--ink2);margin:8px auto 0;max-width:21ch}
.footer{position:absolute;left:66px;right:66px;bottom:20px;display:flex;justify-content:space-between;
  font:400 11.5px/1 var(--mono);color:var(--muted)}
.hud{position:fixed;right:14px;bottom:9px;font:500 11.5px/1 var(--mono);color:var(--muted);opacity:.75}
.cols{display:flex;gap:26px;width:100%;align-items:stretch}
.card{flex:1;background:var(--card);border:1px solid var(--rule);border-radius:4px;padding:17px 19px}
.card h3{font:600 15.5px/1.3 var(--sans);margin:0;color:var(--ink)}
.card p{font:400 13.5px/1.5 var(--sans);color:var(--ink2);margin:7px 0 0}
.card .tag{font:500 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);display:block;margin-bottom:8px}
.eq{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.eq .row{display:flex;align-items:baseline;gap:18px}
.eq .t{font:500 23px/1.35 var(--mono);color:var(--ink);padding:4px 10px;border-radius:3px;
  white-space:nowrap}
.eq .gl{font:400 16px/1.4 var(--sans);color:var(--ink2)}
.legend{display:flex;gap:20px;font:500 12.5px/1 var(--mono);color:var(--ink2);margin-top:10px}
.legend i{display:inline-block;width:15px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.url{font:600 26px/1.2 var(--mono);color:var(--accent)}
.flow{display:flex;align-items:center;gap:15px;justify-content:center;flex-wrap:wrap}
.flowbox{background:var(--card);border:1px solid var(--rule);border-radius:4px;padding:14px 18px;text-align:center}
.flowbox .t{font:600 15px/1.3 var(--sans);color:var(--ink)}
.flowbox .s{font:400 12.5px/1.4 var(--sans);color:var(--muted);margin-top:4px}
.arrow{font:400 21px/1 var(--mono);color:var(--muted)}
@media (prefers-reduced-motion: reduce){ .reveal{transition:none} }

/* y-bounds from the series actually plotted, padded then snapped to a round step */
function bounds(series, opt){
  opt = opt||{};
  let lo=Infinity, hi=-Infinity;
  const a=opt.x0==null?-Infinity:opt.x0, b=opt.x1==null?Infinity:opt.x1;
  series.forEach(s=>s.forEach(q=>{ const v=q[1];
    if(q[0]<a || q[0]>b) return;            // only what the chart will show
    if(v!=null && isFinite(v)){ lo=Math.min(lo,v); hi=Math.max(hi,v); } }));
  if(!isFinite(lo)){ lo=0; hi=1; }
  if(opt.zero){ lo=Math.min(lo,0); hi=Math.max(hi,0); }
  if(hi===lo){ hi=lo+1; }
  if(opt.lo!=null) lo=opt.lo;
  if(opt.hi!=null) hi=opt.hi;
  // snap the RAW range outward. Padding first and snapping after inflated every
  // axis by up to a full step at each end (fiscal data of -4..6.6 became -10..10).
  const step=niceStep(hi-lo, opt.ticks||5);
  return [Math.floor(lo/step)*step, Math.ceil(hi/step)*step, step];
}
function chart(w, h, x0, x1, yb, pad){
  const p = Object.assign({l:46, r:24, t:14, b:26}, pad||{});
  const [y0,y1,ystep] = yb;
  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("width",w); svg.setAttribute("height",h);
  svg.setAttribute("viewBox","0 0 "+w+" "+h);
  const cid = "c"+(chart._n=(chart._n||0)+1);
  const defs=document.createElementNS(svg.namespaceURI,"defs");
  const cp=document.createElementNS(svg.namespaceURI,"clipPath"); cp.setAttribute("id",cid);
  const cr=document.createElementNS(svg.namespaceURI,"rect");
  svg.appendChild(defs); defs.appendChild(cp); cp.appendChild(cr);
  const X = v => p.l + (v-x0)/(x1-x0)*(w-p.l-p.r);
  const Y = v => p.t + (y1-v)/(y1-y0)*(h-p.t-p.b);
  const el = (tag,at,parent)=>{ const n=document.createElementNS(svg.namespaceURI,tag);
    for(const k in at) n.setAttribute(k,at[k]); (parent||svg).appendChild(n); return n; };
  cr.setAttribute("x",p.l); cr.setAttribute("y",p.t);
  cr.setAttribute("width",w-p.l-p.r); cr.setAttribute("height",h-p.t-p.b);
  const dec = ystep<1 ? (ystep<0.2?2:1) : 0;
  for(let v=Math.ceil(y0/ystep)*ystep; v<=y1+1e-9; v+=ystep){
    if(Math.abs(v)<1e-9) v=0;
    el("line",{x1:p.l,x2:w-p.r,y1:Y(v),y2:Y(v),
      class:Math.abs(v)<1e-9?"zeroline":"gridline"});
    el("text",{x:p.l-7,y:Y(v)+4,"text-anchor":"end"}).textContent = v.toFixed(dec); }
  const xstep = niceStep(x1-x0, 5), xdec = xstep<1?1:0;
  for(let v=Math.ceil(x0/xstep)*xstep; v<=x1+1e-9; v+=xstep)
    el("text",{x:X(v),y:h-p.b+17,"text-anchor":"middle"}).textContent = v.toFixed(xdec);
  const clip = pts => pts.filter(q=>q[0]>=x0 && q[0]<=x1 && q[1]!=null);
  const ends = [];                         // end-of-line labels, de-collided on flush
  return {svg, X, Y, el, x0, x1, y0, y1, w, h, p,
    path(pts, at){ const c=clip(pts);
      const d=c.map((q,i)=>(i?"L":"M")+X(q[0]).toFixed(1)+" "+Y(q[1]).toFixed(1)).join(" ");
      return this.el("path", Object.assign({d,class:"series","clip-path":"url(#"+cid+")"},at)); },
    area(a,b,at){
      const up=clip(a).map(q=>X(q[0]).toFixed(1)+" "+Y(q[1]).toFixed(1)).join(" L");
      const dn=clip(b).slice().reverse().map(q=>X(q[0]).toFixed(1)+" "+Y(q[1]).toFixed(1)).join(" L");
      return this.el("path", Object.assign({d:"M"+up+" L"+dn+" Z",
        "clip-path":"url(#"+cid+")"},at)); },
    /* label a series at its own last point; collisions resolved in flush() */
    endLabel(pts, text, color){ const c=clip(pts); if(!c.length) return;
      ends.push({y:Y(c[c.length-1][1]), text:text, color:color}); },
    /* free annotation - placed where asked */
    note(x, y, text, color, anchor){
      this.el("text",{x:X(x),y:Y(y),class:"lbl",style:"fill:"+(color||"var(--muted)"),
        "text-anchor":anchor||"start"}).textContent = text; },
    flush(){
      if(!ends.length) return;
      const MIN=17, top=p.t+7, bot=h-p.b-2;
      ends.sort((a,b)=>a.y-b.y);
      for(let i=1;i<ends.length;i++)
        if(ends[i].y-ends[i-1].y<MIN) ends[i].y=ends[i-1].y+MIN;
      const over = ends[ends.length-1].y - bot;
      if(over>0) ends.forEach(e=>e.y-=over);
      if(ends[0].y<top){ const d=top-ends[0].y; ends.forEach(e=>e.y+=d); }
      ends.forEach(e=>{ this.el("text",{x:w-p.r+6,y:e.y+4,class:"lbl",style:"fill:"+e.color})
        .textContent = e.text; });
      ends.length = 0; }};
}


function drawIn(path, dur, done){
  const L=path.getTotalLength();
  path.style.strokeDasharray=L; path.style.strokeDashoffset=done?0:L;
  if(!done){ path.style.transition="stroke-dashoffset "+(dur||1.3)+"s ease";
    requestAnimationFrame(()=>requestAnimationFrame(()=>path.style.strokeDashoffset=0)); }
  return path;
}
function counter(node,target,dur,dec,done,pre,suf){
  const fmt=v=>(pre||"")+v.toFixed(dec==null?2:dec)+(suf||"");
  if(done){ node.textContent=fmt(target); return; }
  const t0=performance.now();
  (function tick(t){ const u=Math.min(1,(t-t0)/(dur||850));
    node.textContent=fmt(target*(1-Math.pow(1-u,3)));
    if(u<1) requestAnimationFrame(tick); })(t0);
}
const div=(cls,html)=>{const d=document.createElement("div");
  if(cls)d.className=cls; if(html!=null)d.innerHTML=html; return d;};
function shell(kicker,title,take){
  const s=div("slide");
  s.appendChild(div("kicker",kicker));
  if(title){ const h=document.createElement("h2"); h.innerHTML=title; s.appendChild(h); }
  if(take) s.appendChild(div("take",take));
  const wrap=div("chartwrap"); s.appendChild(wrap);
  const f=div("footer");
  f.appendChild(div(null,"Term Premium Atlas"));
  f.appendChild(div(null,"as of "+P.asof));
  s.appendChild(f);
  return {s,wrap};
}
function reveal(node,on,anim){ if(on&&anim){ node.classList.add("reveal");
  requestAnimationFrame(()=>node.classList.add("on")); } return node; }

/* engine: READ mode (default, emailed) vs PRESENT mode (press P) */
let S=0,K=0,PRESENT=false;
const stage=document.getElementById("stage");
const RM=matchMedia("(prefers-reduced-motion: reduce)");
function render(anim){
  stage.innerHTML="";
  if(!PRESENT) K=SLIDES[S].steps;
  SLIDES[S].render(stage,K,!!anim&&!RM.matches);
  document.getElementById("hud").textContent=
    (S+1)+" / "+SLIDES.length+(PRESENT?"  -  present":"");
}
function advance(){
  if(PRESENT&&K<SLIDES[S].steps){ K++; render(true); }
  else if(S<SLIDES.length-1){ S++; K=PRESENT?0:SLIDES[S].steps; render(true); }
}
function back(){
  if(PRESENT&&K>0){ K--; render(false); }
  else if(S>0){ S--; K=SLIDES[S].steps; render(false); }
}
addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){e.preventDefault();advance();}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();back();}
  else if(e.key==="Home"){S=0;K=PRESENT?0:SLIDES[0].steps;render(false);}
  else if(e.key==="End"){S=SLIDES.length-1;K=SLIDES[S].steps;render(false);}
  else if(e.key==="p"||e.key==="P"){PRESENT=!PRESENT;K=PRESENT?0:SLIDES[S].steps;render(true);}
  else if(/^[1-9]$/.test(e.key)){const n=+e.key-1;
    if(n<SLIDES.length){S=n;K=PRESENT?0:SLIDES[n].steps;render(true);}}
});
addEventListener("click",e=>{ (e.clientX>innerWidth/2)?advance():back(); });
function fit(){ stage.style.transform="scale("+Math.min(innerWidth/1300,innerHeight/740)+")"; }
addEventListener("resize",fit); fit(); render(true);
</script>
