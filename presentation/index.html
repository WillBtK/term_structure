<style>
/* Dark-first: this is a projection deck. A deliberate single look — background and
   colors painted explicitly, no theme swap. */
:root{
  --bg:#141517; --stage:#191B1E; --ink:#E9EAEB; --ink2:#B4BAC0; --muted:#7E858C;
  --rule:#2B3036; --rule-soft:#22262B;
  --us:#3987e5; --uk:#d95926; --de:#199e70; --jp:#c98500;
  --accent:#3987e5; --warm:#d95926; --neg:#e66767; --pos:#199e70;
  --serif:"Newsreader",Georgia,serif; --sans:"IBM Plex Sans",sans-serif;
  --mono:"IBM Plex Mono",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
#frame{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1280px;height:720px;background:var(--stage);position:relative;
  border:1px solid var(--rule-soft);transform-origin:center center;overflow:hidden}
.slide{position:absolute;inset:0;padding:56px 72px;display:flex;flex-direction:column}
.kicker{font:500 13px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--serif);font-weight:500;font-size:56px;line-height:1.08;margin:14px 0 0;letter-spacing:-.01em}
h2{font-family:var(--serif);font-weight:500;font-size:36px;line-height:1.12;margin:10px 0 0;letter-spacing:-.005em}
.state{font:400 17px/1.5 var(--sans);color:var(--ink2);max-width:62ch;margin:10px 0 0}
.state b{color:var(--ink);font-weight:600}
.chartwrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
svg{display:block;overflow:visible}
svg text{font-family:var(--mono);fill:var(--muted);font-size:12px}
svg .lbl{font-size:14px;font-weight:600}
.gridline{stroke:var(--rule-soft);stroke-width:1}
.zeroline{stroke:var(--rule);stroke-width:1}
path.series{fill:none;stroke-width:2.25;stroke-linejoin:round;stroke-linecap:round}
path.thin{stroke-width:1.5}
/* line-draw: dasharray/offset set from JS to the path length */
.reveal{opacity:0;transform:translateY(10px);transition:opacity .6s ease,transform .6s ease}
.reveal.on{opacity:1;transform:none}
.dimmable{transition:opacity .6s ease}
.dim{opacity:.16}
.halfdim{opacity:.45}
.bignum{font:600 84px/1 var(--mono);letter-spacing:-.02em}
.eq{font:500 30px/1.4 var(--mono)}
.eq .t{padding:2px 10px;border-radius:3px}
.footer{position:absolute;left:72px;right:72px;bottom:26px;display:flex;justify-content:space-between;
  font:400 12px/1 var(--mono);color:var(--muted)}
.hud{position:fixed;right:14px;bottom:10px;font:500 12px/1 var(--mono);color:var(--muted);opacity:.7}
.caveat{border-left:3px solid var(--rule);padding:10px 0 10px 22px;margin:16px 0}
.caveat h3{font:600 20px/1.3 var(--sans);margin:0;color:var(--ink)}
.caveat p{font:400 16px/1.5 var(--sans);color:var(--ink2);margin:6px 0 0;max-width:70ch}
.bar{transition:width 1s cubic-bezier(.2,.7,.2,1),height 1s cubic-bezier(.2,.7,.2,1)}
.legend{display:flex;gap:22px;font:500 13px/1 var(--mono);color:var(--ink2);margin-top:10px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:middle;margin-right:7px}
.url{font:600 30px/1.2 var(--mono);color:var(--accent);letter-spacing:.01em}
kbd{font:500 11px/1 var(--mono);border:1px solid var(--rule);border-radius:3px;padding:2px 6px;color:var(--ink2)}
</style>

  const fmt = v => (prefix||"") + v.toFixed(dec==null?2:dec) + (suffix||"");
  if(done){ node.textContent = fmt(target); return; }
  const t0 = performance.now();
  (function tick(t){ const u = Math.min(1,(t-t0)/(dur||900));
    node.textContent = fmt(target*(1-Math.pow(1-u,3)));
    if(u<1) requestAnimationFrame(tick); })(t0);
}
const div = (cls, html) => { const d = document.createElement("div");
  if(cls) d.className = cls; if(html!=null) d.innerHTML = html; return d; };
function slideShell(kicker, title, stateText){
  const s = div("slide");
  s.appendChild(div("kicker", kicker));
  if(title){ const h = document.createElement("h2"); h.innerHTML = title; s.appendChild(h); }
  if(stateText) s.appendChild(div("state", stateText));
  const wrap = div("chartwrap"); s.appendChild(wrap);
  const f = div("footer");
  f.appendChild(div(null, "Term Premium Atlas"));
  f.appendChild(div(null, "as of " + P.asof));
  s.appendChild(f);
  return {s, wrap};
}

    k>=2 ? "Today's premium of <b>" + n.tp.toFixed(2) + "%</b> sits <b>" + n.resid.toFixed(2)
           + "pp</b> above fair value — <b>" + n.z.toFixed(1) + "σ</b> of the fit's dispersion. The widest sustained gap in the sample."
         : "Estimated premium against the model's fair value.");
  st.appendChild(s);
  wrap.style.gap = "40px";
  const c = chart(920, 400, 2000, 2027, -1.5, 3.5);
  const ff = mser(P.fair_full).filter(q=>q[0]>=2000);
  const tp = mser(P.tp.US).filter(q=>q[0]>=2000);
  if(k>=1){ const up = ff.map(q=>[q[0], q[1]+n.sigma]), dn = ff.map(q=>[q[0], q[1]-n.sigma]);
    const band = c.area(up, dn, {fill:MC.US, opacity:0});
    band.style.transition = "opacity .8s";
    const f = ()=>band.style.opacity = .12; (anim && k===1) ? setTimeout(f,60) : f(); }
  c.path(ff, {stroke:MC.US, class:"series thin"});
  c.el("text",{x:c.X(2001),y:c.Y(2.5),class:"lbl",fill:MC.US}).textContent="fair value ±1σ";
  c.path(tp, {stroke:"var(--ink2)"});
  c.el("text",{x:c.X(2021.6),y:c.Y(2.2),class:"lbl",fill:"var(--ink2)"}).textContent="estimated premium";
  wrap.appendChild(c.svg);
  if(k>=2){ const box = div("reveal");
    box.innerHTML = `<div class="kicker" style="margin-bottom:8px">TODAY'S GAP</div>
      <div class="bignum" style="color:var(--warm)">+<span id="gn"></span></div>
      <div class="state" style="margin-top:6px"><b>${n.z.toFixed(1)}σ</b> rich vs the drivers</div>`;
    wrap.appendChild(box); requestAnimationFrame(()=>box.classList.add("on"));
    counter(box.querySelector("#gn"), n.resid, 900, 2, !(anim && k===2)); }
}});

/* 15 — how fast does it close? */
SLIDES.push({steps: 3, render(st, k, anim){
  const {s, wrap} = slideShell("ACT V — WHAT IT SAYS NOW", "How fast does the gap close?",
    k>=3 ? "Out of sample, the US and UK prefer some decay; Germany and Japan prefer none. <b>ρ = 0.9 is a judgement, dialled — the scenarios carry the uncertainty.</b>"
         : "The unexplained part is carried forward and decays at ρ per year toward fair value.");
  st.appendChild(s);
  const c = chart(1136, 420, 0, 10, 0, 2.2, {l:56});
  c.el("text",{x:c.X(5),y:412,"text-anchor":"middle"}).textContent="years ahead";
  const labs = {"1.0":"ρ = 1 — every shock permanent", "0.9":"ρ = 0.9 — half-life 6.6y",
                "0.0":"ρ = 0 — mispriced today"};
  const cols = {"1.0":"var(--muted)", "0.9":MC.US, "0.0":"var(--muted)"};
  ["1.0","0.9","0.0"].forEach((r,i)=>{ if(i>k-0) return;
    const pts = P.rho_paths[r].map((v,h)=>[h,v]);
    const p = c.path(pts, {stroke:cols[r], class:r==="0.9"?"series":"series thin"});
    if(r!=="0.9") p.setAttribute("stroke-dasharray","5 4");
    drawIn(p, 1.0, !(anim && i===k));
    c.el("text",{x:c.X(10.15),y:c.Y(pts[10][1])+4,class:"lbl",fill:cols[r]})
      .textContent = labs[r]; });
  wrap.appendChild(c.svg);
}});

/* 16 — your scenario, priced */
SLIDES.push({steps: 3, render(st, k, anim){
  const {s, wrap} = slideShell("ACT V — WHAT IT SAYS NOW", "Your scenario, priced", null);
  st.appendChild(s);
  wrap.style.flexDirection = "column"; wrap.style.gap = "28px";
  const items = [
    "Enter policy, inflation and growth paths per market — the grid opens on the market's own pricing and the WEO baseline, so an untouched sheet is not a view.",
    "The fiscal balance derives from your growth path via each institution's own rule of thumb; the ten-year yield and constant-maturity return follow from the identity.",
    "Both legs converge from the market at rates you control — the premium toward fair value at ρ, your rate view phasing in at λ."];
  const u = div(""); u.style.textAlign = "center"; u.style.marginTop = "10px";
  u.innerHTML = `<div class="url">yield-scenarios.will-oswald.workers.dev</div>
    <div class="state" style="margin:8px auto 0;text-align:center">live now — open it and drive</div>`;
  wrap.appendChild(u);
  items.forEach((t,i)=>{ if(i>k-1) return;
    const n = div((anim && i===k-1) ? "state reveal" : "state");
    n.style.maxWidth = "72ch"; n.innerHTML = "· " + t;
    wrap.appendChild(n);
    if(n.classList.contains("reveal")) requestAnimationFrame(()=>n.classList.add("on")); });
}});

/* 17 — what to hold against it */
SLIDES.push({steps: 3, render(st, k, anim){
  const {s, wrap} = slideShell("CODA", "What to hold against this", null);
  st.appendChild(s);
  wrap.style.flexDirection = "column"; wrap.style.alignItems = "stretch";
  wrap.style.justifyContent = "center"; wrap.style.maxWidth = "880px"; wrap.style.margin = "0 auto";
  const cavs = [
    ["It is a conditional mapping, not a forecaster",
     "Out of sample it matches a random walk at three years — as it should. You supply the scenario; it prices the scenario. Present sensitivities, never point forecasts."],
    ["Japan is directional only",
     "Its beta on the US premium holds across decades (0.74) but not quarters (0.12 on changes since 2010). Use it for the sign and the order of magnitude."],
    ["The residual's persistence is a judgement",
     "The +0.95pp gap can be permanent, fading, or a mispricing — the dial is exposed, the out-of-sample evidence is split, and honest use means showing more than one setting."]];
  cavs.forEach((cv,i)=>{ if(i>k-1) return;
    const d = div("caveat" + ((anim && i===k-1) ? " reveal" : ""));
    d.innerHTML = `<h3>${cv[0]}</h3><p>${cv[1]}</p>`;
    wrap.appendChild(d);
    if(d.classList.contains("reveal")) requestAnimationFrame(()=>d.classList.add("on")); });
}});

/* --------------------------------------------- engine: advance / back / jump -- */
let S = 0, K = 0, animating = false;
const stage = document.getElementById("stage");
function render(anim){
  stage.innerHTML = "";
  SLIDES[S].render(stage, K, !!anim);
  document.getElementById("hud").textContent = (S+1) + " / " + SLIDES.length;
}
function advance(){
  if(K < SLIDES[S].steps){ K++; render(true); }
  else if(S < SLIDES.length-1){ S++; K = 0; render(true); }
}
function back(){
  if(K > 0){ K--; render(false); }
  else if(S > 0){ S--; K = SLIDES[S].steps; render(false); }
}
addEventListener("keydown", e=>{
  if(e.key === "ArrowRight" || e.key === " " || e.key === "PageDown"){ e.preventDefault(); advance(); }
  else if(e.key === "ArrowLeft" || e.key === "PageUp"){ e.preventDefault(); back(); }
  else if(e.key === "Home"){ S = 0; K = 0; render(false); }
  else if(e.key === "End"){ S = SLIDES.length-1; K = SLIDES[S].steps; render(false); }
  else if(/^[1-9]$/.test(e.key)){ const n = +e.key-1;
    if(n < SLIDES.length){ S = n; K = 0; render(true); } }
});
addEventListener("click", e=>{ (e.clientX > innerWidth/2) ? advance() : back(); });
function fit(){
  const sc = Math.min(innerWidth/1300, innerHeight/740);
  stage.style.transform = `scale(${sc})`;
}
addEventListener("resize", fit);
// Respect reduced-motion: render every build pre-snapped, no draws or counters.
const RM = matchMedia("(prefers-reduced-motion: reduce)");
const _render = render;
render = (anim) => _render(anim && !RM.matches);
fit(); render(true);
</script>
