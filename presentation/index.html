<title>From Macro Views to Bond Yields</title>
<style>
/* Typography follows the Atlas, which follows Tufte: ONE humanist serif carries the
   text, headings, table cells and axis labels; monospace appears only where digits
   need to line up in a column. There is no sans-serif face and no webfont -- these
   are system faces, so the deck renders identically behind a proxy that blocks
   fonts.googleapis.com, which is where it is read.

   Emphasis is italic. Bold is reserved for the small number of figures the argument
   actually turns on, so that when something is bold it means something. */
:root{
  --bg:#F4F1EC; --stage:#FBFAF8; --card:#FFFFFF; --sunk:#F4F1EC;
  --ink:#191C1F; --ink2:#4C5257; --muted:#797F85;
  --rule:#E4E0D9; --rule-soft:#EFECE6;
  --us:#2f6fd4; --uk:#c2410c; --de:#157f5b; --jp:#8c2c86;
  --accent:#2f6fd4;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);
  overflow:hidden;font-variant-numeric:tabular-nums}
#frame{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1280px;height:720px;background:var(--stage);position:relative;
  border:1px solid var(--rule);transform-origin:center center;overflow:hidden}
.slide{position:absolute;inset:0;padding:40px 62px 52px;display:flex;flex-direction:column}
.kicker{font:400 12px/1 var(--serif);font-variant-caps:small-caps;letter-spacing:.13em;
  color:var(--muted)}
h1{font-family:var(--serif);font-weight:400;font-size:50px;line-height:1.06;margin:16px 0 0;
  letter-spacing:-.012em;text-wrap:balance}
h2{font-family:var(--serif);font-weight:400;font-size:31px;line-height:1.14;margin:7px 0 0;
  letter-spacing:-.006em;text-wrap:balance}
.take{font:400 15.5px/1.52 var(--serif);color:var(--ink2);max-width:88ch;margin:8px 0 0}
.take b{color:var(--ink);font-weight:700}
.take i{font-style:italic;color:var(--ink)}
.take .hi{color:var(--accent);font-weight:700}
.body{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;gap:30px}
.body.top{align-items:flex-start;justify-content:flex-start}
svg{display:block;overflow:visible}
svg text{font-family:var(--mono);fill:var(--muted);font-size:10.5px}
svg text.lbl{font-family:var(--serif);font-size:12.5px;font-weight:700}
svg text.axl{font-family:var(--serif);font-variant-caps:small-caps;letter-spacing:.05em;
  font-size:12px}
.gridline{stroke:var(--rule-soft);stroke-width:1}
.zeroline{stroke:var(--rule);stroke-width:1.25}
path.series{fill:none;stroke-width:1.9;stroke-linejoin:round;stroke-linecap:round}
path.thin{stroke-width:1.3}
.reveal{opacity:0;transform:translateY(9px);transition:opacity .55s ease,transform .55s ease}
.reveal.on{opacity:1;transform:none}
.dimmable{transition:opacity .55s ease}
.halfdim{opacity:.42}
.bignum{font:400 58px/1 var(--mono);letter-spacing:-.025em}
.stat{text-align:center}
.stat .cap{font:400 11.5px/1.4 var(--serif);font-variant-caps:small-caps;
  letter-spacing:.09em;color:var(--muted)}
.stat .sub{font:400 13px/1.45 var(--serif);color:var(--ink2);margin:7px auto 0;max-width:23ch}
.footer{position:absolute;left:62px;right:62px;bottom:18px;display:flex;
  justify-content:space-between;font:400 11px/1 var(--serif);color:var(--muted)}
.hud{position:fixed;right:14px;bottom:9px;font:400 11.5px/1 var(--mono);color:var(--muted);
  opacity:.7}

/* Sidenotes: Tufte's device, and the reason a slide can hold three ideas without
   becoming a bullet list. The margin carries the qualifications; the main column
   carries the argument. */
.side{width:250px;flex:none;display:flex;flex-direction:column;gap:15px;
  border-left:1px solid var(--rule);padding-left:20px}
.side .n{font:400 13px/1.45 var(--serif);color:var(--ink2)}
.side .n b{color:var(--ink);font-weight:700}
.side .n .h{display:block;font-variant-caps:small-caps;letter-spacing:.07em;
  color:var(--muted);font-size:12px;margin-bottom:2px}

/* A rule-and-number table, not a box grid: the numbers ARE the exhibit. */
table.fig{border-collapse:collapse;font:400 13.5px/1.5 var(--serif)}
table.fig th{font-weight:400;font-variant-caps:small-caps;letter-spacing:.06em;
  color:var(--muted);text-align:right;padding:0 0 5px 22px;
  border-bottom:1px solid var(--rule)}
table.fig th:first-child{text-align:left;padding-left:0}
table.fig td{padding:4px 0 4px 22px;text-align:right;color:var(--ink2);
  font-family:var(--mono);font-size:12.5px}
table.fig td:first-child{text-align:left;padding-left:0;font-family:var(--serif);
  font-size:13.5px;color:var(--ink)}
table.fig tr.sep td{border-top:1px solid var(--rule)}
table.fig td b{color:var(--ink);font-weight:700}
table.fig caption{caption-side:top;text-align:left;font-variant-caps:small-caps;
  letter-spacing:.07em;color:var(--muted);font-size:12px;padding-bottom:7px}

/* Hover readout. The deck is emailed and read unattended, so a reader who wants a
   number should be able to get it off the chart rather than guess from the axis. */
#tip{position:fixed;z-index:40;pointer-events:none;opacity:0;transition:opacity .12s;
  background:var(--card);border:1px solid var(--rule);border-radius:4px;
  padding:7px 10px;box-shadow:0 2px 10px rgba(25,28,31,.10);
  font:400 12.5px/1.5 var(--serif);color:var(--ink2);white-space:nowrap}
#tip .hd{font-variant-caps:small-caps;letter-spacing:.06em;color:var(--muted);
  font-size:11.5px;display:block;margin-bottom:3px}
#tip b{font-family:var(--mono);font-size:12px;color:var(--ink);font-weight:400}
#tip i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;
  vertical-align:baseline}
.xhair{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3;pointer-events:none}
.hdot{pointer-events:none}
.eq{display:flex;flex-direction:column;gap:13px;align-items:flex-start}
.eq .row{display:flex;align-items:baseline;gap:18px}
.eq .t{font:400 22px/1.35 var(--mono);color:var(--ink);padding:4px 10px;border-radius:3px;
  white-space:nowrap}
.eq .gl{font:400 15px/1.4 var(--serif);font-style:italic;color:var(--ink2)}
.legend{display:flex;gap:20px;font:400 12.5px/1 var(--serif);color:var(--ink2);margin-top:10px}
.legend i{display:inline-block;width:15px;height:3px;border-radius:2px;vertical-align:middle;
  margin-right:6px;font-style:normal}
.url{font:400 24px/1.2 var(--mono);color:var(--accent)}
@media (prefers-reduced-motion: reduce){ .reveal{transition:none} }
</style>

        const sx=(w?box.width/w:1), sy=(h?box.height/h:1);
        const ux=(ev.clientX-box.left)/sx, uy=(ev.clientY-box.top)/sy;
        const dx=x0+(ux-p.l)/(w-p.l-p.r)*(x1-x0);
        let html="", any=false;
        if(marks.length){
          let best=null;
          marks.forEach(m=>m.pts.forEach(q=>{
            const d=Math.hypot(X(q[0])-ux, Y(q[1])-uy);
            if(d<22 && (!best||d<best.d)) best={d,q,fmt:m.fmt}; }));
          if(best){ any=true;
            mdot.setAttribute("cx",X(best.q[0])); mdot.setAttribute("cy",Y(best.q[1]));
            mdot.setAttribute("opacity",1);
            html=best.fmt(best.q); }
          else mdot.setAttribute("opacity",0);
        }
        if(!any && tracked.length){
          let head=null;
          tracked.forEach((t,i)=>{
            if(!t.pts.length){ dots[i].setAttribute("opacity",0); return; }
            let lo=0,hi=t.pts.length-1;
            while(lo<hi){ const m=(lo+hi)>>1;
              if(t.pts[m][0]<dx) lo=m+1; else hi=m; }
            const cand=[t.pts[lo], t.pts[Math.max(0,lo-1)]];
            const q=cand.reduce((a,b)=>Math.abs(b[0]-dx)<Math.abs(a[0]-dx)?b:a);
            if(Math.abs(q[0]-dx)>(x1-x0)*0.06){ dots[i].setAttribute("opacity",0); return; }
            head=head||q[0]; any=true;
            dots[i].setAttribute("cx",X(q[0])); dots[i].setAttribute("cy",Y(q[1]));
            dots[i].setAttribute("opacity",1);
            html+="<div><i style=\"background:"+t.color+"\"></i>"+t.name
                 +" <b>"+t.fmt(q[1])+"</b></div>"; });
          if(any && head!=null){
            html="<span class=\"hd\">"+(opt.head?opt.head(head):fmtYear(head))+"</span>"+html;
            line.setAttribute("x1",X(head)); line.setAttribute("x2",X(head));
            line.setAttribute("opacity",.55); }
          else line.setAttribute("opacity",0);
        }
        if(!any){ hide(); return; }
        tip.innerHTML=html;
        tip.style.opacity=1;
        const tb=tip.getBoundingClientRect();
        let lft=ev.clientX+16, top=ev.clientY-tb.height-12;
        if(lft+tb.width>innerWidth-8) lft=ev.clientX-tb.width-16;
        if(top<8) top=ev.clientY+18;
        tip.style.left=lft+"px"; tip.style.top=top+"px";
      });
      return this; },
    flush(){
      if(!ends.length) return;
      const MIN=17, top=p.t+7, bot=h-p.b-2;
      ends.sort((a,b)=>a.y-b.y);
      for(let i=1;i<ends.length;i++)
        if(ends[i].y-ends[i-1].y<MIN) ends[i].y=ends[i-1].y+MIN;
      const over = ends[ends.length-1].y - bot;
      if(over>0) ends.forEach(e=>e.y-=over);
      if(ends[0].y<top){ const d=top-ends[0].y; ends.forEach(e=>e.y+=d); }
      ends.forEach(e=>{ this.el("text",{x:w-p.r+6,y:e.y+4,class:"lbl",style:"fill:"+e.color})
        .textContent = e.text; });
      ends.length = 0; }};
}


const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtYear(v){
  /* Rounding a fractional year can land on month 12 - Dec 2015.9999 is Jan 2016,
     not a bare "2015". Carry rather than fall back to the year alone. */
  let y=Math.floor(v+1e-9), m=Math.round((v-y)*12);
  if(m>=12){ m-=12; y+=1; }
  if(m<0){ m+=12; y-=1; }
  return MONTHS[m]+" "+y;
}
function drawIn(path, dur, done){
  const L=path.getTotalLength();
  path.style.strokeDasharray=L; path.style.strokeDashoffset=done?0:L;
  if(!done){ path.style.transition="stroke-dashoffset "+(dur||1.3)+"s ease";
    requestAnimationFrame(()=>requestAnimationFrame(()=>path.style.strokeDashoffset=0)); }
  return path;
}
function counter(node,target,dur,dec,done,pre,suf){
  const fmt=v=>(pre||"")+v.toFixed(dec==null?2:dec)+(suf||"");
  if(done){ node.textContent=fmt(target); return; }
  const t0=performance.now();
  (function tick(t){ const u=Math.min(1,(t-t0)/(dur||850));
    node.textContent=fmt(target*(1-Math.pow(1-u,3)));
    if(u<1) requestAnimationFrame(tick); })(t0);
}
const div=(cls,html)=>{const d=document.createElement("div");
  if(cls)d.className=cls; if(html!=null)d.innerHTML=html; return d;};
function shell(kicker,title,take){
  const s=div("slide");
  s.appendChild(div("kicker",kicker));
  if(title){ const h=document.createElement("h2"); h.innerHTML=title; s.appendChild(h); }
  if(take) s.appendChild(div("take",take));
  const wrap=div("body"); s.appendChild(wrap);
  const f=div("footer");
  f.appendChild(div(null,"Term Premium Atlas"));
  f.appendChild(div(null,P.asof_label));
  s.appendChild(f);
  return {s,wrap};
}
function reveal(node,on,anim){ if(on&&anim){ node.classList.add("reveal");
  requestAnimationFrame(()=>node.classList.add("on")); } return node; }
const pct=v=>Math.round(v*100);
const allTP=()=>MK.map(c=>mser(P.tp[c]));

/* Sidenotes carry the qualifications a Tufte page would put in the margin, so the
   main column can stay an argument instead of becoming a bullet list. */
function sidenotes(wrap, notes, k, anim){
  const col=div("side");
  notes.forEach((n,i)=>{ if(k!=null && i>k-1) return;
    const d=div("n","<span class=\"h\">"+n[0]+"</span>"+n[1]);
    col.appendChild(reveal(d, k!=null && i===k-1, anim)); });
  wrap.appendChild(col); return col;
}
/* A ruled figure table. Rows are [label, ...cells]; a leading "-" row draws a rule. */
function figtable(caption, head, rows){
  const t=document.createElement("table"); t.className="fig";
  if(caption){ const c=document.createElement("caption"); c.textContent=caption;
    t.appendChild(c); }
  if(head){ const tr=document.createElement("tr");
    head.forEach(h=>{ const th=document.createElement("th"); th.innerHTML=h;
      tr.appendChild(th); }); t.appendChild(tr); }
  rows.forEach(r=>{ const tr=document.createElement("tr");
    if(r[0]==="-"){ tr.className="sep"; r=r.slice(1); }
    r.forEach(c=>{ const td=document.createElement("td"); td.innerHTML=c;
      tr.appendChild(td); }); t.appendChild(tr); });
  return t;
}

    +"assume the output gap has closed. A slump widens the deficit for cyclical reasons, and "
    +"that part was being priced as if it were structural - so a hard landing "
    +"<i>raised</i> the US premium, the opposite of 2008 and 2020. The premium now prices "
    +"the deficit <span class='hi'>with the cycle taken out</span>.");
  st.appendChild(o.s);
  o.wrap.style.gap="40px"; o.wrap.style.alignItems="flex-start";
  o.wrap.style.justifyContent="flex-start"; o.wrap.style.marginTop="14px";
  const gap=(a,b)=>sg(b-a);
  const t=figtable("Ten-year term premium at the ten-year horizon",
    ["","Baseline","Hard landing","Gap"],
    [["<i>Before</i>","","",""],
     ["US fiscal contribution",sg(B.US.fb),sg(B.US.fh),"<b style=\"color:var(--ink)\">"+gap(B.US.fb,B.US.fh)+"</b>"],
     ["US term premium",B.US.tb.toFixed(2),B.US.th.toFixed(2),gap(B.US.tb,B.US.th)],
     ["Bund fiscal contribution",sg(B.DE.fb),sg(B.DE.fh),"<b style=\"color:var(--ink)\">"+gap(B.DE.fb,B.DE.fh)+"</b>"],
     ["Bund term premium",B.DE.tb.toFixed(2),B.DE.th.toFixed(2),gap(B.DE.tb,B.DE.th)],
     ["-","<i>Now</i>","","",""],
     ["US fiscal contribution",sg(N.US.fb),sg(N.US.fh),"<b style=\"color:var(--ink)\">"+gap(N.US.fb,N.US.fh)+"</b>"],
     ["US term premium",N.US.tb.toFixed(2),N.US.th.toFixed(2),gap(N.US.tb,N.US.th)],
     ["Bund fiscal contribution",sg(N.DE.fb),sg(N.DE.fh),"<b style=\"color:var(--ink)\">"+gap(N.DE.fb,N.DE.fh)+"</b>"],
     ["Bund term premium",N.DE.tb.toFixed(2),N.DE.th.toFixed(2),gap(N.DE.tb,N.DE.th)]]);
  const tl=div(""); tl.style.cssText="display:flex;flex-direction:column;gap:12px;flex:none";
  tl.appendChild(t);
  tl.appendChild(div(null,"<div style=\"font:400 13px/1.45 var(--serif);color:var(--ink2);max-width:52ch\">"
    +"The fiscal term now separates the two scenarios by almost nothing. What remains in "
    +"both is the official projections' own path - the CBO's rising deficit - which is "
    +"structural and belongs in every scenario. In the hard landing, falling inflation "
    +"(<b style=\"color:var(--ink)\">"+sg(X.hl.us_infl)+"</b> on the US premium) now leads; "
    +"inflation uncertainty adds "+sg(X.hl.us_unc)+".</div>"));
  o.wrap.appendChild(tl);
  if(k>=1) sidenotes(o.wrap,[
    ["How the structural deficit is found",
     "The sheet already derives the deficit from your growth row, using each authority's "
     +"own sensitivity - CBO, OBR, the European Commission, the OECD for Japan. Reversing "
     +"that arithmetic is the cyclical adjustment those institutions publish. Untouched, "
     +"it returns the official path exactly; a growth view alone no longer moves the "
     +"premium through the deficit."],
    ["What you type is priced against the cycle",
     "A recession deficit typed with a recession growth row prices nothing extra; a cut "
     +"the growth row cannot explain prices in full. What no cyclical adjustment can do is "
     +"tell a boom from higher potential growth - a structural gain is stated on the "
     +"deficit row."]], k, anim);
}});

/* --------------------------------------------- 13 - five scenarios, four markets */
SLIDES.push({steps:1, render(st,k,anim){
  const h=k>=1?1:0, H=h?"ten":"three";
  const o=shell(Q[11],"Five scenarios, four markets",
    "The ten-year term premium and ten-year yield each scenario implies, as the sheet "
    +"prices it. The US sets the direction; each market's own inflation, ownership and "
    +"fiscal position set how far it travels. Both legs converge from today's market "
    +"pricing rather than jumping to the model's answer.");
  st.appendChild(o.s);
  o.wrap.style.gap="36px"; o.wrap.style.alignItems="flex-start";
  o.wrap.style.justifyContent="flex-start"; o.wrap.style.marginTop="14px";
  const mk=["US","UK","DE","JP"];
  const cell=(tp,y)=>"<b style=\"color:var(--ink)\">"+tp.toFixed(2)+"</b>"
    +"<span style=\"color:var(--muted)\"> &middot; "+y.toFixed(2)+"</span>";
  const rows=[["Today"].concat(mk.map(c=>cell(X.today[c].tp,X.today[c].y)))];
  rows.push(["-"].concat(["<i>At "+H+" years</i>","","","",""]).slice(0,6));
  Object.keys(X.scen).forEach(s=>rows.push([s].concat(mk.map(c=>cell(X.scen[s][c][h].tp,X.scen[s][c][h].y)))));
  const t=figtable("Ten-year term premium &middot; ten-year yield, per cent - at "+H+" years",
    ["",MN.US,MN.UK,MN.DE,MN.JP], rows);
  t.querySelector("caption").innerHTML="Ten-year term premium &middot; ten-year yield, per cent, at the "
    +H+"-year horizon";
  const tw=div(""); tw.style.cssText="display:flex;flex-direction:column;gap:10px;flex:none";
  tw.appendChild(t);
  tw.appendChild(div(null,"<div style=\"font:400 12.5px/1.45 var(--serif);color:var(--muted);max-width:66ch\">"
    +"Scenario sheet as of "+X.asof+". Hard landing holds the BoE, ECB and BoJ at 0% for "
    +"the decade and the Fed at 1%, so outside the US its yield is the premium alone."
    +(h?"":" Step forward for the ten-year horizon.")+"</div>"));
  o.wrap.appendChild(tw);
  sidenotes(o.wrap,[
    ["Hard landing", (()=>{
       // worded from the numbers: each market's ten-year premium against its baseline
       const d=c=>X.scen["Hard Landing"][c][1].tp-X.scen["Baseline"][c][1].tp;
       const w=v=>Math.abs(v)<0.05?"level with":(v<0?"below":(v<0.15?"a little above":"above"));
       const us=d("US"), rest=[["UK","the UK's"],["DE","Germany's"],["JP","Japan's"]]
         .map(([c,n])=>n+" "+(w(d(c))==="level with"?"level with it":w(d(c))));
       return "At ten years the US premium ends "+w(us)+" its baseline, "
         +rest.slice(0,-1).join(", ")+" and "+rest[rest.length-1]+". Where a premium ends "
         +"higher, that is inflation uncertainty and the US channel - not a cyclical deficit. "
         +"The yield falls everywhere because policy rates do."; })()],
    ["Germany",
     "When the method changed in August its ten-year baseline premium rose from <b>"+X.de_journey[0].toFixed(2)
     +"</b> to <b>"+X.de_journey[1].toFixed(2)+"</b> with the pooled fiscal sensitivity, and to <b>"
     +X.de_journey[2].toFixed(2)+"</b> once the cycle was taken out of the deficit. On today's "
     +"data and baseline it is <b>"+X.scen["Baseline"]["DE"][1].tp.toFixed(2)+"</b>."],
    ["Goldilocks",
     "With the cycle taken out of the deficit, it works through inflation. The US premium "
     +"falls most; elsewhere inflation falls by less than in the US, which offsets part or "
     +"all of what the US channel takes off."]], 3, false);
}});

/* ------------------------------------------ 11 - what it is not, and where it runs */
SLIDES.push({steps:2, render(st,k,anim){
  const o=shell(Q[12],"What to hold against this - and where it runs",
    "Four things a sceptical reader should know before using any of it.");
  st.appendChild(o.s);
  o.wrap.style.flexDirection="column"; o.wrap.style.gap="22px";
  o.wrap.classList.add("top"); o.wrap.style.paddingTop="6px";

  const cav=div(""); cav.style.cssText="display:flex;flex-direction:column;width:100%";
  [["It prices scenarios - it does not forecast",
    "Out of sample at three years it does no better than assuming yields stay put, which "
    +"is the expected result and the honest one. You supply the macro view; this prices "
    +"it. Present it as a sensitivity, never as a point forecast."],
   ["Japan is directional only",
    "Its link to the US premium holds across decades but weakly quarter to quarter. Use "
    +"it for the sign and the rough magnitude, not the decimal."],
   ["Some parameters are judgements, and are exposed as dials",
    "How fast today's unexplained premium fades, and how fast a stated rate view gets "
    +"priced into the curve, are settings rather than measurements. Both are visible in "
    +"the tool and honest use means showing more than one."],
   ["A growth view is read as the cycle",
    "Growth above the official baseline is treated as a boom, never as higher potential "
    +"growth, so it does not lower the priced deficit. A structural fiscal view is "
    +"stated on the deficit row."]]
   .forEach((c,i)=>{
     const row=div(""); row.style.cssText="display:flex;gap:24px;align-items:baseline;"
       +"padding:12px 0;"+(i?"border-top:1px solid var(--rule);":"");
     row.innerHTML="<div style=\"width:300px;flex:none;font-size:15.5px;color:var(--ink)\">"
       +c[0]+"</div><div style=\"font-size:13.5px;line-height:1.5;color:var(--ink2);"
       +"max-width:72ch\">"+c[1]+"</div>";
     cav.appendChild(row); });
  o.wrap.appendChild(cav);

  if(k>=1){
    const g=div(""); g.style.cssText="width:100%;border-top:1px solid var(--rule);"
      +"padding-top:18px;display:flex;align-items:center;gap:34px";
    g.innerHTML="<div style=\"flex:none;width:250px\">"
      +"<div style=\"font-variant-caps:small-caps;letter-spacing:.07em;font-size:12.5px;"
      +"color:var(--muted);margin-bottom:5px\">It runs as a tool, not a document</div>"
      +"<div style=\"font-size:17px;color:var(--ink);line-height:1.3\">"
      +"An interactive scenario sheet</div></div>"
      +"<div style=\"font-size:13.5px;line-height:1.5;color:var(--ink2);max-width:70ch\">"
      +"Enter a policy rate, inflation and growth path per market; the sheet derives the "
      +"fiscal balance, the term premium and the ten-year yield, and reports the return "
      +"that implies at three years and at ten. The grid opens on the market's own pricing "
      +"and the IMF's baseline, so an untouched sheet is not a view - every number you "
      +"change is visibly your own.</div>";
    o.wrap.appendChild(reveal(g,k===1,anim)); }
}});

/* engine: READ mode (default, emailed) vs PRESENT mode (press P) */
let S=0,K=0,PRESENT=false;
const stage=document.getElementById("stage");
const RM=matchMedia("(prefers-reduced-motion: reduce)");
function render(anim){
  stage.innerHTML="";
  if(!PRESENT) K=SLIDES[S].steps;
  SLIDES[S].render(stage,K,!!anim&&!RM.matches);
  document.getElementById("hud").textContent=
    (S+1)+" / "+SLIDES.length+(PRESENT?"  -  present":"");
}
function advance(){
  if(PRESENT&&K<SLIDES[S].steps){ K++; render(true); }
  else if(S<SLIDES.length-1){ S++; K=PRESENT?0:SLIDES[S].steps; render(true); }
}
function back(){
  if(PRESENT&&K>0){ K--; render(false); }
  else if(S>0){ S--; K=SLIDES[S].steps; render(false); }
}
addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){e.preventDefault();advance();}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();back();}
  else if(e.key==="Home"){S=0;K=PRESENT?0:SLIDES[0].steps;render(false);}
  else if(e.key==="End"){S=SLIDES.length-1;K=SLIDES[S].steps;render(false);}
  else if(e.key==="p"||e.key==="P"){PRESENT=!PRESENT;K=PRESENT?0:SLIDES[S].steps;render(true);}
  else if(/^[1-9]$/.test(e.key)){const n=+e.key-1;
    if(n<SLIDES.length){S=n;K=PRESENT?0:SLIDES[n].steps;render(true);}}
});
addEventListener("click",e=>{ (e.clientX>innerWidth/2)?advance():back(); });
function fit(){ stage.style.transform="scale("+Math.min(innerWidth/1300,innerHeight/740)+")"; }
addEventListener("resize",fit); fit(); render(true);
</script>
